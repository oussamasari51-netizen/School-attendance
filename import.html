<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استيراد قوائم التلاميذ — نظام الغيابات</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="icon">📥</div>
    <div>
      <h1>استيراد قوائم التلاميذ</h1>
      <div class="meta">من ملف المنصة الرقمية لوزارة التربية</div>
    </div>
  </div>
  <div class="user-chip">
    <span id="adminName">...</span>
    <a href="admin.html" style="color:#fff; text-decoration:none; font-size:13px; margin-left:10px;">⟵ لوحة الناظر</a>
    <button onclick="logout()">خروج</button>
  </div>
</div>

<div class="page" style="max-width:760px;">

  <div class="auth-card" style="max-width:none; padding:28px;">
    <h1 style="font-size:17px; margin-bottom:6px;">اختر الملف</h1>
    <p class="sub" style="margin-bottom:20px;">
      يدعم ملفات المنصة الرقمية (Eleve.xls) وملفات Excel العادية (.xlsx). سيتم إنشاء الأقسام تلقائياً حسب عمودي "السنة" و"القسم" في الملف.
    </p>

    <input type="file" id="fileInput" accept=".xls,.xlsx,.csv" style="margin-bottom:16px;">

    <div id="statusBox" class="loading-text" style="display:none;"></div>

    <div id="previewBox" style="display:none; margin-top:18px;">
      <div class="section-title" style="margin-top:0;">معاينة قبل الاستيراد</div>
      <div id="previewSummary" class="student-list" style="padding:14px 18px; font-size:14px;"></div>
      <button class="btn-primary" id="confirmBtn" style="margin-top:16px; width:100%;">تأكيد الاستيراد</button>
    </div>

    <div id="resultBox" class="auth-error" style="display:none; background:var(--resolved-light); color:var(--resolved);"></div>
  </div>

</div>

<script src="assets/config.js"></script>
<script>
let profile = null;
let parsedStudents = []; // {full_name, gender, birth_date, national_id, className}

const LEVEL_MAP = { "أولى": 1, "ثانية": 2, "ثالثة": 3, "رابعة": 4 };

function norm(s) {
  return (s || "").toString().replace(/\s+/g, " ").trim();
}

async function init() {
  profile = await requireSession("admin");
  if (!profile) return;
  document.getElementById("adminName").textContent = profile.full_name;
}
init();

document.getElementById("fileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const statusBox = document.getElementById("statusBox");
  statusBox.style.display = "block";
  statusBox.textContent = "جاري قراءة الملف...";
  document.getElementById("previewBox").style.display = "none";
  document.getElementById("resultBox").style.display = "none";

  const text = await file.text();

  let rows = [];
  if (text.includes("<table") || text.includes("<TABLE")) {
    rows = parseHtmlTable(text);
  } else {
    rows = await parseWithSheetJS(file);
  }

  if (!rows || rows.length === 0) {
    statusBox.textContent = "لم أتمكن من قراءة أي بيانات من هذا الملف.";
    return;
  }

  parsedStudents = buildStudents(rows);
  statusBox.style.display = "none";
  renderPreview();
});

function parseHtmlTable(htmlText) {
  const doc = new DOMParser().parseFromString(htmlText, "text/html");
  const table = doc.querySelector("table");
  if (!table) return [];
  const trs = Array.from(table.querySelectorAll("tr"));
  if (trs.length === 0) return [];

  const headerCells = Array.from(trs[0].querySelectorAll("th,td")).map(c => norm(c.textContent));
  const rows = [];
  for (let i = 1; i < trs.length; i++) {
    const cells = Array.from(trs[i].querySelectorAll("td"));
    if (cells.length === 0) continue;
    const obj = {};
    headerCells.forEach((h, idx) => { obj[h] = norm(cells[idx] ? cells[idx].textContent : ""); });
    rows.push(obj);
  }
  return rows;
}

function parseWithSheetJS(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const wb = XLSX.read(e.target.result, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });
      resolve(json.map(r => {
        const obj = {};
        Object.keys(r).forEach(k => obj[norm(k)] = norm(r[k]));
        return obj;
      }));
    };
    reader.readAsArrayBuffer(file);
  });
}

function buildStudents(rows) {
  const list = [];
  rows.forEach(r => {
    const lastName = r["اللقب"] || "";
    const firstName = r["الاسم"] || "";
    const fullName = norm(`${lastName} ${firstName}`);
    if (!fullName) return;

    const levelWord = r["السنة"] || "";
    const levelNum = LEVEL_MAP[levelWord];
    const section = (r["القسم"] || "").toString().trim();
    if (!levelNum || !section) return;

    const className = `${levelNum}م${section}`;

    list.push({
      full_name: fullName,
      gender: r["الجنس"] || null,
      birth_date: r["تاريخ الازدياد"] || null,
      national_id: r["رقم التعريف"] || null,
      className
    });
  });
  return list;
}

function renderPreview() {
  const byClass = {};
  parsedStudents.forEach(s => {
    byClass[s.className] = (byClass[s.className] || 0) + 1;
  });
  const classNames = Object.keys(byClass).sort();

  let html = `<div style="margin-bottom:10px;"><b>${parsedStudents.length}</b> تلميذ موزعين على <b>${classNames.length}</b> قسم:</div>`;
  html += `<div style="display:flex; flex-wrap:wrap; gap:8px;">`;
  classNames.forEach(c => {
    html += `<span class="status-pill resolved">${c} — ${byClass[c]}</span>`;
  });
  html += `</div>`;

  document.getElementById("previewSummary").innerHTML = html;
  document.getElementById("previewBox").style.display = "block";
}

document.getElementById("confirmBtn").addEventListener("click", async () => {
  const btn = document.getElementById("confirmBtn");
  btn.disabled = true;
  btn.textContent = "جاري الاستيراد...";

  // 1) تأكد من وجود كل الأقسام، أنشئ الناقص منها
  const neededClasses = [...new Set(parsedStudents.map(s => s.className))];
  const { data: existingClasses } = await db.from("classes").select("id, name");
  const classMap = {};
  (existingClasses || []).forEach(c => classMap[c.name] = c.id);

  const toCreate = neededClasses.filter(n => !classMap[n]).map(name => ({ name }));
  if (toCreate.length > 0) {
    const { data: created, error } = await db.from("classes").insert(toCreate).select("id, name");
    if (error) {
      showResult("خطأ أثناء إنشاء الأقسام: " + error.message, false);
      btn.disabled = false; btn.textContent = "تأكيد الاستيراد";
      return;
    }
    (created || []).forEach(c => classMap[c.name] = c.id);
  }

  // 2) أدخل التلاميذ (تجاهل من له رقم تعريف موجود مسبقاً)
  const { data: existingStudents } = await db.from("students").select("national_id").not("national_id", "is", null);
  const existingIds = new Set((existingStudents || []).map(s => s.national_id));

  const toInsert = parsedStudents
    .filter(s => !s.national_id || !existingIds.has(s.national_id))
    .map(s => ({
      full_name: s.full_name,
      gender: s.gender,
      birth_date: s.birth_date || null,
      national_id: s.national_id || null,
      class_id: classMap[s.className]
    }));

  const skipped = parsedStudents.length - toInsert.length;

  let insertedCount = 0;
  const chunkSize = 200;
  for (let i = 0; i < toInsert.length; i += chunkSize) {
    const chunk = toInsert.slice(i, i + chunkSize);
    const { error } = await db.from("students").insert(chunk);
    if (error) {
      showResult("خطأ أثناء إدخال التلاميذ: " + error.message, false);
      btn.disabled = false; btn.textContent = "تأكيد الاستيراد";
      return;
    }
    insertedCount += chunk.length;
  }

  showResult(`تم استيراد ${insertedCount} تلميذاً بنجاح في ${neededClasses.length} قسم${skipped > 0 ? ` (تم تجاوز ${skipped} مسجّلين مسبقاً)` : ""}.`, true);
  btn.disabled = false;
  btn.textContent = "تأكيد الاستيراد";
  document.getElementById("previewBox").style.display = "none";
  document.getElementById("fileInput").value = "";
});

function showResult(msg, ok) {
  const box = document.getElementById("resultBox");
  box.style.display = "block";
  box.style.background = ok ? "var(--resolved-light)" : "var(--absent-light)";
  box.style.color = ok ? "var(--resolved)" : "var(--absent)";
  box.textContent = msg;
}
</script>
<div class="app-footer">© جميع الحقوق محفوظة — OUSSAMA SARI 2026</div>
</body>
</html>
