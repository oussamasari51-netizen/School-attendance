<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — نظام إدارة الغيابات</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-body">

<div class="login-card">
  <div class="brand-header">
    <div class="brand-icon">🏫</div>
    <h2>نظام إدارة الغيابات</h2>
    <p>يرجى تسجيل الدخول للمتابعة</p>
  </div>

  <div id="errBox" class="alert-error" style="display:none;"></div>

  <form id="loginForm">
    <div class="field">
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" required placeholder="example@school.dz" dir="ltr">
    </div>

    <div class="field">
      <label for="password">كلمة السر</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>

    <button type="submit" id="loginBtn" class="btn-primary" style="width:100%; margin-top:10px;">دخول</button>
  </form>
</div>

<script src="assets/config.js"></script>
<script>
  // التحقق المباشر من الجلسة والتوجيه تلقائياً
  (async () => {
    const { data: { session } } = await db.auth.getSession();
    if (session) {
      const { data: profile } = await db.from("users").select("role").eq("auth_id", session.user.id).single();
      if (profile) {
        if (profile.role === "teacher" || profile.role === "supervisor") {
          window.location.href = "teacher.html";
        } else {
          window.location.href = "admin.html";
        }
      }
    }
  })();

  const form = document.getElementById("loginForm");
  const errBox = document.getElementById("errBox");
  const loginBtn = document.getElementById("loginBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errBox.style.display = "none";
    loginBtn.disabled = true;
    loginBtn.textContent = "جاري التحقق...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      errBox.textContent = "البريد الإلكتروني أو كلمة السر غير صحيحة.";
      errBox.style.display = "block";
      loginBtn.disabled = false;
      loginBtn.textContent = "دخول";
      return;
    }

    const { data: profile, error: profErr } = await db
      .from("users")
      .select("role")
      .eq("auth_id", data.user.id)
      .single();

    if (profErr || !profile) {
      errBox.textContent = "هذا الحساب غير مفعّل في النظام. تواصل مع الإدارة.";
      errBox.style.display = "block";
      await db.auth.signOut();
      loginBtn.disabled = false;
      loginBtn.textContent = "دخول";
      return;
    }

    // توجيه الأستاذ والمكلف بالغياب لصفحة teacher.html والبقية لصفحة الناظر
    if (profile.role === "teacher" || profile.role === "supervisor") {
      window.location.href = "teacher.html";
    } else {
      window.location.href = "admin.html";
    }
  });
</script>
<div class="app-footer">© جميع الحقوق محفوظة — OUSSAMA SARI 2026</div>
</body>
</html>
