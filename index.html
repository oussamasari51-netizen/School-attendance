<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — نظام إدارة الغيابات</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg, #f8fafc);
    margin: 0;
    padding: 16px;
  }
  .login-card {
    background: var(--surface, #ffffff);
    border: 1px solid var(--line, #e2e8f0);
    border-radius: 16px;
    padding: 32px 24px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
  }
  .login-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .login-header .icon {
    font-size: 48px;
    margin-bottom: 8px;
  }
  .login-header h1 {
    font-size: 1.4rem;
    color: var(--ink, #0f172a);
    margin: 0 0 4px 0;
  }
  .login-header p {
    font-size: 0.85rem;
    color: var(--ink-soft, #64748b);
    margin: 0;
  }
  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: bold;
    color: var(--ink-soft, #475569);
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line, #cbd5e1);
    border-radius: 8px;
    font-size: 0.95rem;
    box-sizing: border-box;
    transition: border-color 0.2s;
  }
  .form-group input:focus {
    outline: none;
    border-color: #2563eb;
  }
  .btn-submit {
    width: 100%;
    padding: 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-submit:hover {
    background: #1d4ed8;
  }
  .error-msg {
    color: #ef4444;
    font-size: 0.85rem;
    text-align: center;
    margin-top: 12px;
    display: none;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <div class="icon">🏫</div>
    <h1>تسجيل الدخول</h1>
    <p>أدخل اسم المستخدم وكلمة المرور للمتابعة</p>
  </div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="username">اسم المستخدم</label>
      <input type="text" id="username" required placeholder="أدخل اسم المستخدم..." autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">دخول</button>
    <div id="errorMsg" class="error-msg"></div>
  </form>
</div>

<script src="assets/config.js"></script>
<script>
async function handleLogin(e) {
  e.preventDefault();
  const userInp = document.getElementById("username").value.trim();
  const passInp = document.getElementById("password").value.trim();
  const errDiv = document.getElementById("errorMsg");
  const btn = document.getElementById("submitBtn");

  errDiv.style.display = "none";
  btn.disabled = true;
  btn.textContent = "جاري التحقق...";

  try {
    // الاستعلام عن حساب المستخدم من جدول الدخول
    const { data, error } = await db
      .from("profiles")
      .select("*")
      .eq("username", userInp)
      .eq("password", passInp)
      .maybeSingle();

    if (error || !data) {
      errDiv.textContent = "اسم المستخدم أو كلمة المرور غير صحيحة.";
      errDiv.style.display = "block";
      btn.disabled = false;
      btn.textContent = "دخول";
      return;
    }

    // حفظ الجلسة محلياً والتوجيه حسب الرتبة
    localStorage.setItem("session_user", JSON.stringify(data));

    if (data.role === "admin" || data.role === "supervisor") {
      window.location.href = "duty.html";
    } else {
      window.location.href = "teacher.html";
    }

  } catch (err) {
    console.error(err);
    errDiv.textContent = "حدث خطأ في الإتصال بالقاعدة.";
    errDiv.style.display = "block";
    btn.disabled = false;
    btn.textContent = "دخول";
  }
}

// التوجيه تلقائياً إذا كان المستخدم مسجلاً دخوله بالفعل
document.addEventListener("DOMContentLoaded", () => {
  const session = localStorage.getItem("session_user");
  if (session) {
    const user = JSON.parse(session);
    if (user.role === "admin" || user.role === "supervisor") {
      window.location.href = "duty.html";
    } else if (user.role === "teacher") {
      window.location.href = "teacher.html";
    }
  }
});
</script>

</body>
</html>
