<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهام مشرفي التربية — برنامج الناظر</title>
<link rel="stylesheet" href="assets/style.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  table.duty-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); margin-bottom: 20px; }
  .duty-table th, .duty-table td { border: 1px solid var(--paper); padding: 7px; text-align: center; vertical-align: top; font-size: 12.5px; }
  .duty-table th { background: var(--primary-light); color: var(--primary-dark); }
  .duty-table td.time-col { background: var(--paper); font-weight: 700; min-width: 130px; text-align: right; }
  .duty-table td.time-col .tlabel { display:block; }
  .duty-table td.time-col .ttime { display:block; font-size:11px; color:var(--ink-soft); font-weight:500; }
  .duty-table input.cell-input { width: 100%; border: none; background: transparent; text-align: center; font-size: 12px; font-family: 'Tajawal', sans-serif; padding: 5px; border-radius: 6px; }
  .duty-table input.cell-input:focus { background: var(--primary-light); outline: none; }
  .row-del-btn { background: var(--absent-light); color: var(--absent); border: none; border-radius: 6px; width: 20px; height: 20px; font-size: 11px; cursor: pointer; margin-right:4px; }
  .copy-row-btn { background: var(--primary-light); color: var(--primary); border: none; border-radius: 6px; width: 20px; height: 20px; font-size: 11px; cursor: pointer; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items:center; }
  .time-label-edit { width: 100%; border:none; background:transparent; font-weight:700; font-size:12.5px; text-align:right; }
  .time-time-edit { width: 100%; border:none; background:transparent; font-size:11px; color:var(--ink-soft); text-align:right; }
</style>
</head>
<body>

<div class="app-shell">
<div id="sidebarMount"></div>
<div class="main-area">

<div class="topbar">
  <div class="brand">
    <div class="icon">🛡️</div>
    <div>
      <h1>مهام مشرفي التربية</h1>
      <div class="meta">صفحة توقيت كاملة لكل مشرف — حسب أيام الأسبوع</div>
    </div>
  </div>
  <div class="user-chip">
    <span id="adminName">...</span>
    <button onclick="logout()">خروج</button>
  </div>
</div>

<div class="page">

  <div class="toolbar">
    <select id="supervisorSelect" class="datepick-inline"></select>
    <button class="btn-ghost" id="addSupervisorBtn">+ إضافة مشرف</button>
    <button class="btn-ghost" id="editSupervisorBtn">✏️ تعديل الاسم</button>
    <button class="btn-ghost" id="delSupervisorBtn" style="color:var(--absent); background:var(--absent-light);">حذف هذا المشرف</button>
    <button class="btn-ghost" id="addRowBtn">+ إضافة صف زمني</button>
    <button class="btn-primary" id="printBtn">🖨️ طباعة صفحة المشرف</button>
  </div>

  <div class="field" style="max-width:420px;">
    <label>الأقسام المسندة لهذا المشرف</label>
    <input type="text" id="assignedClasses" placeholder="مثال: 4م1+4م2+4م3">
  </div>

  <div id="loadingMsg" class="loading-text">جاري التحميل...</div>
  <div style="overflow-x:auto;">
    <table class="duty-table" id="dutyTable" style="display:none;"></table>
  </div>

  <div class="section-title" style="margin-top:0;">المهام المسندة (نفس النص لكل المشرفين — قابل للتعديل)</div>
  <div style="background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px;">
    <textarea id="notesArea" rows="10" style="width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px; font-family:'Tajawal',sans-serif; font-size:13px;"></textarea>
    <button class="btn-primary" id="saveNotesBtn" style="margin-top:10px;">حفظ</button>
  </div>

</div>

</div><!-- /main-area -->
</div><!-- /app-shell -->

<script src="assets/config.js?v=2"></script>
<script src="assets/sidebar.js?v=2"></script>
<script>
const DAYS = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس"];
let profile = null;
let supervisors = [];
let tasks = [];
let cellsMap = {}; // `${taskId}_${day}` -> content (للمشرف الحالي فقط)
let currentSupervisorId = null;

async function init() {
  profile = await requireSession(["admin", "supervisor"]);
  if (!profile) return;
  document.getElementById("adminName").textContent = profile.full_name;
  renderSidebar("duty", profile.role);

  const { data: settings } = await db.from("app_settings").select("value").eq("key", "duty_notes");
  document.getElementById("notesArea").value = (settings && settings[0]) ? settings[0].value : "";

  await loadSupervisors();
}

async function loadSupervisors() {
  const { data } = await db.from("supervisors").select("id, full_name, assigned_classes").order("full_name");
  supervisors = data || [];
  const sel = document.getElementById("supervisorSelect");
  sel.innerHTML = supervisors.map(s => `<option value="${s.id}">${s.full_name}</option>`).join("");
  if (supervisors.length) {
    currentSupervisorId = supervisors[0].id;
    sel.value = currentSupervisorId;
    document.getElementById("assignedClasses").value = supervisors[0].assigned_classes || "";
    await loadGridData();
  } else {
    document.getElementById("loadingMsg").textContent = "لا يوجد مشرفون بعد — اضغط «+ إضافة مشرف» للبدء.";
  }
}

document.getElementById("supervisorSelect").addEventListener("change", async (e) => {
  currentSupervisorId = e.target.value;
  const s = supervisors.find(x => x.id === currentSupervisorId);
  document.getElementById("assignedClasses").value = s ? (s.assigned_classes || "") : "";
  await loadGridData();
});

document.getElementById("assignedClasses").addEventListener("change", async (e) => {
  await db.from("supervisors").update({ assigned_classes: e.target.value.trim() }).eq("id", currentSupervisorId);
  showToast("تم الحفظ");
});

async function loadGridData() {
  document.getElementById("loadingMsg").style.display = "block";
  document.getElementById("dutyTable").style.display = "none";

  const [{ data: tk }, { data: cells }] = await Promise.all([
    db.from("duty_tasks").select("id, label, time_label, order_index").order("order_index"),
    db.from("duty_cells").select("task_id, day_of_week, content").eq("supervisor_id", currentSupervisorId),
  ]);
  tasks = tk || [];
  cellsMap = {};
  (cells || []).forEach(c => cellsMap[`${c.task_id}_${c.day_of_week}`] = c.content || "");

  renderTable();
  document.getElementById("loadingMsg").style.display = "none";
  document.getElementById("dutyTable").style.display = "table";
}

function renderTable() {
  const table = document.getElementById("dutyTable");
  let html = "<thead><tr><th>التوقيت</th>" + DAYS.map(d => `<th>${d}</th>`).join("") + "</tr></thead><tbody>";
  tasks.forEach(t => {
    html += `<tr>
      <td class="time-col">
        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:4px;">
          <div style="flex:1;">
            <input class="time-label-edit" value="${t.label}" data-task="${t.id}" data-field="label" onchange="updateTaskField(this)">
            <input class="time-time-edit" value="${t.time_label || ""}" data-task="${t.id}" data-field="time_label" onchange="updateTaskField(this)">
          </div>
          <div>
            <button class="copy-row-btn" title="انسخ خانة الأحد لبقية الأيام" onclick="copyRowAcrossDays('${t.id}')">⧉</button>
            <button class="row-del-btn" title="حذف الصف" onclick="deleteTask('${t.id}')">×</button>
          </div>
        </div>
      </td>`;
    DAYS.forEach((d, dow) => {
      const key = `${t.id}_${dow}`;
      html += `<td><input class="cell-input" value="${cellsMap[key] || ""}" data-task="${t.id}" data-day="${dow}" onchange="updateCell(this)"></td>`;
    });
    html += "</tr>";
  });
  html += "</tbody>";
  table.innerHTML = html;
}

async function updateTaskField(el) {
  const field = el.dataset.field;
  await db.from("duty_tasks").update({ [field]: el.value.trim() }).eq("id", el.dataset.task);
  showToast("تم الحفظ");
}

async function updateCell(el) {
  const task_id = el.dataset.task, day_of_week = parseInt(el.dataset.day, 10);
  const key = `${task_id}_${day_of_week}`;
  const { error } = await db.from("duty_cells")
    .upsert({ supervisor_id: currentSupervisorId, task_id, day_of_week, content: el.value }, { onConflict: "supervisor_id,task_id,day_of_week" });
  if (error) { showToast("حدث خطأ أثناء الحفظ"); return; }
  cellsMap[key] = el.value;
  showToast("تم الحفظ");
}

async function copyRowAcrossDays(taskId) {
  const base = cellsMap[`${taskId}_0`] || "";
  const rows = [0, 1, 2, 3, 4].map(dow => ({ supervisor_id: currentSupervisorId, task_id: taskId, day_of_week: dow, content: base }));
  const { error } = await db.from("duty_cells").upsert(rows, { onConflict: "supervisor_id,task_id,day_of_week" });
  if (error) { showToast("حدث خطأ"); return; }
  showToast("تم النسخ لكل الأيام");
  loadGridData();
}

// زر إضافة مشرف جديد بطلب الاسم
document.getElementById("addSupervisorBtn").addEventListener("click", async () => {
  const name = prompt("أدخل اسم المشرف الجديد:");
  if (!name || !name.trim()) return;

  const { error } = await db.from("supervisors").insert({ full_name: name.trim() });
  if (error) { showToast("حدث خطأ أثناء إضافة المشرف"); return; }
  showToast("تمت إضافة المشرف بنجاح");
  loadSupervisors();
});

// زر تعديل اسم المشرف الحالي
document.getElementById("editSupervisorBtn").addEventListener("click", async () => {
  if (!currentSupervisorId) return;
  const s = supervisors.find(x => x.id === currentSupervisorId);
  const newName = prompt("تعديل اسم المشرف:", s ? s.full_name : "");
  if (!newName || !newName.trim()) return;

  const { error } = await db.from("supervisors").update({ full_name: newName.trim() }).eq("id", currentSupervisorId);
  if (error) { showToast("حدث خطأ أثناء التعديل"); return; }
  showToast("تم تعديل الاسم");
  loadSupervisors();
});

document.getElementById("delSupervisorBtn").addEventListener("click", async () => {
  if (!currentSupervisorId) return;
  const s = supervisors.find(x => x.id === currentSupervisorId);
  if (!confirm(`حذف المشرف "${s ? s.full_name : ""}" وكل بياناته؟`)) return;
  await db.from("supervisors").delete().eq("id", currentSupervisorId);
  loadSupervisors();
});

document.getElementById("addRowBtn").addEventListener("click", async () => {
  const nextOrder = tasks.length ? Math.max(...tasks.map(t => t.order_index)) + 1 : 1;
  const { error } = await db.from("duty_tasks").insert({ label: "صف جديد", time_label: "", order_index: nextOrder });
  if (error) { showToast("حدث خطأ"); return; }
  loadGridData();
});

async function deleteTask(id) {
  if (!confirm("حذف هذا الصف الزمني من جدول كل المشرفين؟")) return;
  await db.from("duty_tasks").delete().eq("id", id);
  loadGridData();
}

document.getElementById("saveNotesBtn").addEventListener("click", async () => {
  const { error } = await db.from("app_settings")
    .upsert({ key: "duty_notes", value: document.getElementById("notesArea").value }, { onConflict: "key" });
  if (error) { showToast("حدث خطأ"); return; }
  showToast("تم الحفظ");
});

document.getElementById("printBtn").addEventListener("click", () => {
  const s = supervisors.find(x => x.id === currentSupervisorId);
  const notes = (document.getElementById("notesArea").value || "").split("\n").filter(Boolean)
    .map(l => `<li>${l.replace(/^\d+\.\s*/, "")}</li>`).join("");

  let rows = tasks.map(t => {
    const cells = DAYS.map((d, dow) => `<td>${cellsMap[`${t.id}_${dow}`] || ""}</td>`).join("");
    return `<tr><td class="tcol"><b>${t.label}</b><br><small>${t.time_label || ""}</small></td>${cells}</tr>`;
  }).join("");

  let html = `
  <html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>مهام مشرفي التربية</title>
  <style>
    body{font-family:Arial,Tahoma,sans-serif; padding:24px; color:#111;}
    .head{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;}
    h1{font-size:20px; text-align:center; border:3px double #111; display:inline-block; padding:8px 30px; margin:10px auto 16px; display:block; width:fit-content;}
    .wrap-h1{text-align:center;}
    .supname{font-size:15px; font-weight:bold; margin-bottom:12px;}
    table{width:100%; border-collapse:collapse; margin-bottom:16px;}
    th,td{border:2px solid #111; padding:6px; text-align:center; font-size:11.5px;}
    th{background:#eee; font-size:13px;}
    td.tcol{text-align:right; font-size:11px; min-width:110px;}
    .assigned{font-weight:bold; margin-bottom:14px; font-size:13px;}
    ol{font-size:11.5px; padding-right:20px;}
    .sign{display:flex; justify-content:space-between; margin-top:40px; font-size:12.5px;}
    .sign div{text-align:center; width:30%;}
  </style></head><body>
    <div class="head"><span>السنة الدراسية: ${SCHOOL_YEAR}</span><span>${SCHOOL_NAME}</span></div>
    <div class="wrap-h1"><h1>مهام مشرفي التربية</h1></div>
    <div class="supname">مشرف التربية: ${s ? s.full_name : ""}</div>
    <table>
      <tr><th>التوقيت</th>${DAYS.map(d => `<th>${d}</th>`).join("")}</tr>
      ${rows}
    </table>
    <div class="assigned">الأقسام المسندة: ${s ? (s.assigned_classes || "") : ""}</div>
    <b>المهام المسندة:</b>
    <ol>${notes}</ol>
    <div class="sign">
      <div>المدير<br><br>ـــــــــــــ</div>
      <div>مشرفة التربية العامة<br><br>ـــــــــــــ</div>
      <div>مشرف التربية<br><br>ـــــــــــــ</div>
    </div>
  </body></html>`;
  const w = window.open("", "_blank");
  w.document.write(html);
  w.document.close();
});

init();
</script>
<div class="app-footer">© جميع الحقوق محفوظة — OUSSAMA SARI 2026</div>
</body>
</html>
