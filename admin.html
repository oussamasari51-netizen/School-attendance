<!-- استدعاء ملفات الإعدادات والجانبيات مع التأكد من وجودها داخل مجلد assets -->
<script src="assets/config.js"></script>
<script src="assets/sidebar.js"></script>

<script>
let profile = null;
let selectedDate = null;
let currentDayPeriods = [];

async function loadKpiStrip() {
  try {
    const [{ count: studentCount }, { count: classCount }, { count: teacherCount }, { data: todayRecs }] = await Promise.all([
      db.from("students").select("id", { count: "exact", head: true }).eq("active", true),
      db.from("classes").select("id", { count: "exact", head: true }),
      db.from("teachers").select("id", { count: "exact", head: true }),
      db.from("attendance_records").select("student_id, status").eq("record_date", selectedDate),
    ]);
    const absentToday = new Set((todayRecs || []).filter(r => r.status !== "تسوية وضعية").map(r => r.student_id)).size;

    const strip = document.getElementById("kpiStrip");
    if (strip) {
      strip.innerHTML = `
        <div class="kpi-mini"><div class="kval">${studentCount ?? 0}</div><div class="klabel">تلميذ مسجّل</div></div>
        <div class="kpi-mini"><div class="kval">${classCount ?? 0}</div><div class="klabel">قسم</div></div>
        <div class="kpi-mini"><div class="kval">${teacherCount ?? 0}</div><div class="klabel">أستاذ</div></div>
        <div class="kpi-mini"><div class="kval">${absentToday}</div><div class="klabel">غياب اليوم</div></div>
      `;
    }
  } catch (err) {
    console.error("خطأ في تحميل KPI:", err);
  }
}

function fmtDateOf(iso) {
  const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
  const d = new Date(iso + "T00:00:00");
  return `${dayNames[d.getDay()]} — ${d.toLocaleDateString("ar-DZ")}`;
}

async function init() {
  try {
    profile = await requireSession(["admin", "supervisor"]);
    if (!profile) return;

    document.getElementById("adminName").textContent = profile.full_name;
    
    // التأكد من وجود دالة الشريط الجانبي لتفادي التوقف
    if (typeof renderSidebar === "function") {
      renderSidebar("admin", profile.role);
    }

    selectedDate = todayISO();
    const picker = document.getElementById("datePicker");
    picker.value = selectedDate;
    picker.max = todayISO();
    picker.addEventListener("change", () => {
      selectedDate = picker.value || todayISO();
      document.getElementById("dateLabel").textContent = fmtDateOf(selectedDate);
      loadKpiStrip();
      loadClassMatrix();
    });

    document.getElementById("dateLabel").textContent = fmtDateOf(selectedDate);
    await loadKpiStrip();

    // جلب الأقسام
    const { data: classes, error } = await db.from("classes").select("id, name").order("name");
    const classSelector = document.getElementById("classSelector");
    classSelector.innerHTML = "";
    
    if (classes && classes.length > 0) {
      classes.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = c.name;
        classSelector.appendChild(opt);
      });
      loadClassMatrix();
    } else {
      classSelector.innerHTML = `<option value="">لا توجد أقسام</option>`;
    }
  } catch (e) {
    console.error("حدث خطأ أثناء البدء:", e);
  }
}

async function loadClassMatrix() {
  const classId = document.getElementById("classSelector").value;
  const container = document.getElementById("matrixContainer");

  if (!classId) {
    container.innerHTML = `<div class="empty-state"><div class="icon">🏫</div>يرجى اختيار قسم لمتابعة الغيابات.</div>`;
    return;
  }

  currentDayPeriods = getPeriodsForDay(selectedDate);
  if (!currentDayPeriods || currentDayPeriods.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">🏖️</div>عطلة أسبوعية — لا توجد حصص مبرمجة في هذا اليوم.</div>`;
    return;
  }

  container.innerHTML = `<div class="loading-text">جاري تحميل شبكة القسم...</div>`;

  const [{ data: students }, { data: records }] = await Promise.all([
    db.from("students").select("id, full_name").eq("class_id", classId).eq("active", true).order("full_name"),
    db.from("attendance_records").select("id, student_id, hour_slot, status").eq("class_id", classId).eq("record_date", selectedDate)
  ]);

  if (!students || students.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">👤</div>لا يوجد تلاميذ مسجلون في هذا القسم.</div>`;
    return;
  }

  const recMap = {};
  (records || []).forEach(r => {
    recMap[`${r.student_id}_${r.hour_slot}`] = { id: r.id, status: r.status };
  });

  let html = `
    <table class="matrix-table">
      <thead>
        <tr>
          <th style="width: 220px; text-align: right;">اسم التلميذ</th>`;
  
  currentDayPeriods.forEach(p => {
    html += `<th>${p.label}<br><span style="font-size:10px; font-weight:normal; opacity:0.8;">${p.time}</span></th>`;
  });

  html += `</tr>
      </thead>
      <tbody id="matrixBody">`;

  students.forEach(s => {
    html += `<tr class="student-item" data-name="${s.full_name}">
      <td style="font-weight: bold;">${s.full_name}</td>`;

    currentDayPeriods.forEach(p => {
      const rec = recMap[`${s.student_id}_${p.slot}`];
      const status = rec ? rec.status : "حاضر";
      let btnClass = "slot-btn present";
      if (status === "غائب") btnClass = "slot-btn absent";
      else if (status === "تسوية وضعية" || status === "خروج استثنائي") btnClass = "slot-btn resolved";

      html += `<td>
        <button class="${btnClass}" 
                data-studentid="${s.id}" 
                data-slot="${p.slot}" 
                data-recid="${rec ? rec.id : ''}"
                onclick="toggleSlot(this)">
          ${p.slot}
        </button>
      </td>`;
    });

    html += `</tr>`;
  });

  html += `</tbody></table>`;
  container.innerHTML = html;
}

async function toggleSlot(btn) {
  const studentId = btn.dataset.studentid;
  const slot = parseInt(btn.dataset.slot);
  const classId = document.getElementById("classSelector").value;

  if (btn.classList.contains("present")) {
    btn.className = "slot-btn absent";
    const { data } = await db.from("attendance_records").upsert({
      student_id: studentId,
      class_id: classId,
      record_date: selectedDate,
      hour_slot: slot,
      status: "غائب"
    }, { onConflict: "student_id,record_date,hour_slot" }).select("id").single();
    
    if (data) btn.dataset.recid = data.id;
    if (typeof showToast === "function") showToast("تم تسجيل الغياب");

  } else if (btn.classList.contains("absent")) {
    btn.className = "slot-btn resolved";
    await db.from("attendance_records").update({
      status: "تسوية وضعية",
      updated_at: new Date().toISOString()
    }).eq("student_id", studentId).eq("record_date", selectedDate).eq("hour_slot", slot);
    
    if (typeof showToast === "function") showToast("تم تسوية الوضعية");

  } else {
    btn.className = "slot-btn present";
    await db.from("attendance_records").delete()
      .eq("student_id", studentId)
      .eq("record_date", selectedDate)
      .eq("hour_slot", slot);
    
    btn.dataset.recid = "";
    if (typeof showToast === "function") showToast("تم إلغاء الغياب (حاضر)");
  }

  loadKpiStrip();
}

function filterStudents() {
  const q = document.getElementById("studentSearch").value.toLowerCase().trim();
  const rows = document.querySelectorAll(".student-item");
  rows.forEach(row => {
    const name = row.dataset.name.toLowerCase();
    row.style.display = name.includes(q) ? "" : "none";
  });
}

// بدء التشغيل
document.addEventListener("DOMContentLoaded", init);
</script>
