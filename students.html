<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الأقسام والتلاميذ — برنامج الناظر</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  .page-container {
    max-width: 850px;
    margin: 0 auto;
    padding: 15px;
  }

  /* بطاقات الأقسام */
  .classes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
    margin-top: 15px;
  }

  .class-card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }

  .class-card:hover, .class-card.active {
    background: rgba(52, 152, 219, 0.15);
    border-color: #3498db;
    transform: translateY(-2px);
  }

  .class-card .cname {
    font-size: 16px;
    font-weight: bold;
    color: #fff;
  }

  .class-card .csub {
    font-size: 11px;
    color: #aaa;
    margin-top: 4px;
  }

  .class-card .del-btn {
    position: absolute;
    top: 4px;
    left: 4px;
    background: none;
    border: none;
    color: #e74c3c;
    font-size: 12px;
    cursor: pointer;
    padding: 4px;
    display: none;
  }

  .class-card:hover .del-btn {
    display: block;
  }

  /* أسطر التلاميذ */
  .student-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 15px;
  }

  .student-row {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .student-row .sname {
    font-weight: bold;
    color: #fff;
    font-size: 14px;
  }

  .student-row .smeta {
    font-size: 11px;
    color: #aaa;
    margin-top: 2px;
  }

  .action-btn {
    padding: 5px 10px;
    font-size: 12px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
  }

  .btn-edit { background: #f39c12; color: #fff; }
  .btn-del { background: #e74c3c; color: #fff; }
  .btn-add { background: #27ae60; color: #fff; font-weight: bold; }

  /* النوافذ المنبثقة Modals */
  .modal-backdrop {
    position: fixed;
    top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
    padding: 15px;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-sheet {
    background: #1e272e;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 400px;
    box-sizing: border-box;
  }

  .field-group {
    margin-bottom: 12px;
  }

  .field-group label {
    display: block;
    font-size: 12px;
    color: #ccc;
    margin-bottom: 5px;
  }

  .field-group input, .field-group select {
    width: 100%;
    padding: 9px;
    background: #111;
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 6px;
    box-sizing: border-box;
  }
</style>
</head>
<body>

<div class="app-shell">
  <div id="sidebarMount"></div>
  
  <div class="main-area">

    <!-- Topbar -->
    <div class="topbar">
      <div class="brand">
        <div class="icon">👥</div>
        <div>
          <h1>إدارة الأقسام والتلاميذ</h1>
          <div class="meta">تحديد القسم وتسيير التلاميذ بشكل مباشر</div>
        </div>
      </div>
      <div class="user-chip">
        <span id="adminName">ساري أسامة</span>
        <button onclick="logout()">خروج</button>
      </div>
    </div>

    <!-- Page Content -->
    <div class="page-container">

      <!-- 1. شريط التحكم بالأقسام -->
      <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; border:1px solid rgba(255,255,255,0.1);">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <h3 style="margin:0; font-size:15px; color:#fff;">🏫 أقسام المؤسسة</h3>
          
          <div style="display:flex; gap:8px; align-items:center;">
            <select id="levelSelect" style="padding:6px 10px; background:#222; border:1px solid rgba(255,255,255,0.2); color:#fff; border-radius:6px; font-size:12px;">
              <option value="1">1 متوسط</option>
              <option value="2">2 متوسط</option>
              <option value="3">3 متوسط</option>
              <option value="4">4 متوسط</option>
            </select>
            <button id="addSectionBtn" class="action-btn btn-add">+ إضافة قسم</button>
          </div>
        </div>

        <!-- شبكة بطاقات الأقسام -->
        <div class="classes-grid" id="classGrid">
          <div style="color:#aaa; font-size:12px; grid-column:1/-1;">جاري التحميل...</div>
        </div>
      </div>

      <!-- 2. قائمة تلاميذ القسم المحدد -->
      <div id="studentSection" style="display:none; margin-top:25px;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">
          <div>
            <h3 id="selectedClassTitle" style="margin:0; font-size:16px; color:#3498db;"></h3>
            <div id="selectedClassCount" style="font-size:12px; color:#aaa;"></div>
          </div>
          <button class="action-btn btn-add" onclick="openAddStudentModal()">+ إضافة تلميذ للقسم</button>
        </div>

        <div class="student-list" id="studentList"></div>
      </div>

    </div>

  </div>
</div>

<!-- Modal: إضافة/تعديل تلميذ -->
<div class="modal-backdrop" id="studentModal">
  <div class="modal-sheet">
    <h3 id="modalTitle" style="margin-top:0; color:#fff; font-size:16px;">إضافة تلميذ جديد</h3>
    
    <form id="studentForm">
      <input type="hidden" id="studentId">
      
      <div class="field-group">
        <label>الاسم واللقب *</label>
        <input type="text" id="fullNameInput" required placeholder="مثال: علي بلقاسم">
      </div>

      <div class="field-group">
        <label>رقم التعريف الوطني (اختياري)</label>
        <input type="text" id="nationalIdInput" placeholder="رقم التعريف...">
      </div>

      <div class="field-group">
        <label>الجنس</label>
        <select id="genderSelect">
          <option value="ذكر">ذكر</option>
          <option value="أنثى">أنثى</option>
        </select>
      </div>

      <div style="display:flex; gap:8px; margin-top:15px;">
        <button type="submit" class="action-btn btn-add" style="flex:1; padding:10px;">حفظ</button>
        <button type="button" class="action-btn" style="background:#555; color:#fff;" onclick="closeStudentModal()">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/config.js"></script>
<script src="assets/sidebar.js"></script>
<script>renderSidebar("students");</script>
<script>
let profile = null;
let allClasses = [];
let selectedClass = null;
let currentStudents = [];

async function init() {
  profile = await requireSession("admin");
  if (profile && profile.full_name) {
    document.getElementById("adminName").textContent = profile.full_name;
  }
  await loadClasses();
}
init();

// 1. تحميل وتنسيق بطاقات الأقسام
async function loadClasses() {
  const { data, error } = await db.from("classes").select("*").order("name");
  if (error) return console.error(error);
  
  allClasses = data || [];
  const grid = document.getElementById("classGrid");
  grid.innerHTML = "";

  if (allClasses.length === 0) {
    grid.innerHTML = `<div style="color:#aaa; font-size:12px; grid-column:1/-1;">لا توجد أقسام. قم بإضافة قسم من الأعلى.</div>`;
    document.getElementById("studentSection").style.display = "none";
    return;
  }

  allClasses.forEach(c => {
    const card = document.createElement("div");
    card.className = `class-card ${selectedClass && selectedClass.id === c.id ? 'active' : ''}`;
    card.innerHTML = `
      <button class="del-btn" onclick="deleteClass(event, '${c.id}', '${c.name}')" title="حذف القسم">✕</button>
      <div class="cname">${c.name}</div>
      <div class="csub">عرض القائمة</div>
    `;
    card.onclick = (e) => {
      if (e.target.classList.contains('del-btn')) return;
      selectClass(c);
    };
    grid.appendChild(card);
  });
}

// 2. اختيار قسم لعرض قوائمه
async function selectClass(cls) {
  selectedClass = cls;
  await loadClasses(); // لتحديث البطاقة النشطة

  document.getElementById("studentSection").style.display = "block";
  document.getElementById("selectedClassTitle").textContent = `تلاميذ قسم: ${cls.name}`;
  
  await loadStudents();
  document.getElementById("studentSection").scrollIntoView({ behavior: "smooth" });
}

// 3. تحميل تلاميذ القسم المنسق فقط
async function loadStudents() {
  if (!selectedClass) return;
  const list = document.getElementById("studentList");
  list.innerHTML = `<div style="color:#aaa; font-size:13px; text-align:center; padding:15px;">جاري تحميل التلاميذ...</div>`;

  const { data, error } = await db.from("students").select("*").eq("class_id", selectedClass.id).order("full_name");
  if (error) return console.error(error);

  currentStudents = data || [];
  document.getElementById("selectedClassCount").textContent = `العدد الإجمالي: ${currentStudents.length} تلميذ`;

  if (currentStudents.length === 0) {
    list.innerHTML = `<div style="color:#aaa; font-size:13px; text-align:center; padding:20px; background:rgba(255,255,255,0.02); border-radius:8px;">لا يوجد تلاميذ في هذا القسم حالياً.</div>`;
    return;
  }

  list.innerHTML = "";
  currentStudents.forEach((s, idx) => {
    const row = document.createElement("div");
    row.className = "student-row";
    row.innerHTML = `
      <div>
        <div class="sname">${idx + 1}. ${s.full_name}</div>
        <div class="smeta">الجنس: ${s.gender || "-"} | رقم التعريف: ${s.national_id || "-"}</div>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="action-btn btn-edit" onclick="openEditStudentModal('${s.id}')">تعديل</button>
        <button class="action-btn btn-del" onclick="deleteStudent('${s.id}')">حذف</button>
      </div>
    `;
    list.appendChild(row);
  });
}

// 4. إضافة قسم تلقائياً
document.getElementById("addSectionBtn").addEventListener("click", async () => {
  const level = document.getElementById("levelSelect").value;
  const prefix = `${level}م`;

  const existingNames = allClasses.map(c => c.name).filter(n => n.startsWith(prefix));
  let maxNum = 0;
  existingNames.forEach(name => {
    const num = parseInt(name.replace(prefix, ''));
    if (!isNaN(num) && num > maxNum) maxNum = num;
  });

  const nextClassName = `${prefix}${maxNum + 1}`;
  const { error } = await db.from("classes").insert([{ name: nextClassName }]);

  if (error) alert("خطأ: " + error.message);
  else await loadClasses();
});

// 5. حذف قسم
async function deleteClass(e, classId, className) {
  e.stopPropagation();
  if (!confirm(`هل أنت متأكد من حذف قسم (${className})؟ سيؤدي هذا لحذف جميع التلاميذ بداخل القسم!`)) return;

  const { error } = await db.from("classes").delete().eq("id", classId);
  if (error) alert("خطأ: " + error.message);
  else {
    if (selectedClass && selectedClass.id === classId) selectedClass = null;
    await loadClasses();
  }
}

// 6. التحكم بالنموذج المنبثق للتلاميذ (Modal)
function openAddStudentModal() {
  document.getElementById("studentId").value = "";
  document.getElementById("studentForm").reset();
  document.getElementById("modalTitle").textContent = `إضافة تلميذ إلى (${selectedClass.name})`;
  document.getElementById("studentModal").classList.add("open");
}

function openEditStudentModal(id) {
  const s = currentStudents.find(item => item.id === id);
  if (!s) return;

  document.getElementById("studentId").value = s.id;
  document.getElementById("fullNameInput").value = s.full_name;
  document.getElementById("nationalIdInput").value = s.national_id || "";
  document.getElementById("genderSelect").value = s.gender || "ذكر";

  document.getElementById("modalTitle").textContent = "تعديل بيانات التلميذ";
  document.getElementById("studentModal").classList.add("open");
}

function closeStudentModal() {
  document.getElementById("studentModal").classList.remove("open");
}

document.getElementById("studentForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = document.getElementById("studentId").value;
  const payload = {
    full_name: document.getElementById("fullNameInput").value.trim(),
    national_id: document.getElementById("nationalIdInput").value.trim() || null,
    gender: document.getElementById("genderSelect").value,
    class_id: selectedClass.id
  };

  let error = null;
  if (id) {
    const res = await db.from("students").update(payload).eq("id", id);
    error = res.error;
  } else {
    const res = await db.from("students").insert([payload]);
    error = res.error;
  }

  if (error) alert("خطأ: " + error.message);
  else {
    closeStudentModal();
    await loadStudents();
  }
});

async function deleteStudent(id) {
  if (!confirm("هل أنت متأكد من حذف هذا التلميذ؟")) return;
  const { error } = await db.from("students").delete().eq("id", id);
  if (error) alert("خطأ: " + error.message);
  else await loadStudents();
}
</script>
<div class="app-footer" style="text-align:center; padding:15px; color:#aaa; font-size:12px;">© جميع الحقوق محفوظة — OUSSAMA SARI 2026</div>
</body>
</html>
