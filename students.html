<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة التلاميذ — نظام الغيابات</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- مكتبة jsPDF للتحميل والطبع -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  .filter-bar { display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
  .filter-bar select, .filter-bar input { padding:8px 12px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; }
  table.rtable { width:100%; border-collapse:collapse; font-size:13.5px; background:var(--surface); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
  table.rtable th, table.rtable td { padding:10px 12px; text-align:right; border-bottom:1px solid var(--paper); }
  table.rtable th { color:var(--ink-soft); font-size:12.5px; background:var(--primary-light); }
  .action-btn { border:none; background:none; cursor:pointer; font-size:15px; padding:4px 6px; }
  .btn-group { display:flex; gap:8px; flex-wrap:wrap; }
</style>
</head>
<body>

<div class="app-shell">
<div id="sidebarMount"></div>
<div class="main-area">

<div class="topbar">
  <div class="brand">
    <div class="icon">👥</div>
    <div>
      <h1>إدارة قائمة التلاميذ</h1>
      <div class="meta">عرض، بحث، طباعة التقرير وإدارة حركة التلاميذ</div>
    </div>
  </div>
  <div class="user-chip">
    <span id="userName">...</span>
    <button onclick="logout()">خروج</button>
  </div>
</div>

<div class="page">

  <div class="filter-bar">
    <label><b>القسم:</b></label>
    <select id="classFilter">
      <option value="">جميع الأقسام</option>
    </select>

    <label><b>البحث:</b></label>
    <input type="text" id="searchInput" placeholder="ابحث باسم التلميذ...">

    <div class="btn-group" style="margin-right:auto;">
      <button class="btn-primary" onclick="openAddModal()">➕ إضافة تلميذ جديد</button>
      <button class="btn-secondary" onclick="exportSeptemberReportPDF()">📄 حركة سبتمبر (PDF)</button>
    </div>
  </div>

  <div id="loadingText" class="loading-text">جاري تحميل قائمة التلاميذ...</div>

  <table class="rtable" id="studentsTable" style="display:none;">
    <thead>
      <tr>
        <th>رقم التعريف</th>
        <th>الاسم واللقب</th>
        <th>الجنس</th>
        <th>القسم</th>
        <th>تاريخ الازدياد</th>
        <th>الحالة</th>
        <th>إجراءات</th>
      </tr>
    </thead>
    <tbody id="studentsBody"></tbody>
  </table>

</div>

</div><!-- /main-area -->
</div><!-- /app-shell -->

<!-- 1. Modal إضافة / تعديل تلميذ -->
<div id="studentModal" class="modal-backdrop" style="display:none;">
  <div class="modal-card">
    <h2 id="modalTitle">إضافة تلميذ جديد</h2>
    <input type="hidden" id="editStudentId">
    
    <div style="margin-top:12px;">
      <label>الاسم واللقب:</label>
      <input type="text" id="mFullName" class="input-field" placeholder="مثال: محمد بلقاسم">
    </div>

    <div style="margin-top:10px;">
      <label>القسم:</label>
      <select id="mClassId" class="input-field"></select>
    </div>

    <div style="margin-top:10px;">
      <label>الجنس:</label>
      <select id="mGender" class="input-field">
        <option value="ذكر">ذكر</option>
        <option value="أنثى">أنثى</option>
      </select>
    </div>

    <div style="margin-top:10px;">
      <label>رقم التعريف الوطني:</label>
      <input type="text" id="mNationalId" class="input-field" placeholder="اختياري">
    </div>

    <div style="margin-top:10px;">
      <label>تاريخ الازدياد:</label>
      <input type="date" id="mBirthDate" class="input-field">
    </div>

    <div style="display:flex; gap:10px; margin-top:18px;">
      <button class="btn-primary" onclick="saveStudent()">حفظ</button>
      <button class="btn-secondary" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- 2. Modal خيارات الحذف / الشطب (تغيير مؤسسة / التخلي / أخرى) -->
<div id="deleteModal" class="modal-backdrop" style="display:none;">
  <div class="modal-card">
    <h2>شطب / حذف تلميذ</h2>
    <p style="font-size:13px; color:var(--ink-soft); margin-top:4px;">حدد سبب المغادرة لتسجيل الحركة في تقرير سبتمبر:</p>
    <input type="hidden" id="deleteStudentId">

    <div style="margin-top:14px;">
      <label>سبب الشطب:</label>
      <select id="deleteReason" class="input-field" onchange="toggleOtherReasonInput()">
        <option value="تغيير مؤسسة">تغيير مؤسسة (تحويل)</option>
        <option value="التخلي عن الدراسة">التخلي عن الدراسة (انقطاع)</option>
        <option value="حذف نهائي">حذف نهائي من القاعدة</option>
        <option value="أخرى">أخرى (حدد السبب)</option>
      </select>
    </div>

    <div id="otherReasonContainer" style="margin-top:10px; display:none;">
      <label>السبب بالتفصيل:</label>
      <input type="text" id="customReason" class="input-field" placeholder="أدخل سبب المغادرة...">
    </div>

    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn-primary" style="background:#dc2626;" onclick="confirmDeleteStudent()">تأكيد الشطب</button>
      <button class="btn-secondary" onclick="closeDeleteModal()">إلغاء</button>
    </div>
  </div>
</div>

<script src="assets/config.js"></script>
<script src="assets/sidebar.js"></script>
<script>
let profile = null;
let allClasses = [];
let allStudents = [];

async function init() {
  profile = await requireSession(["admin", "supervisor"]);
  if (!profile) return;
  document.getElementById("userName").textContent = profile.full_name;

  renderSidebar("students", profile.role);

  await loadClasses();
  await loadStudents();
}

async function loadClasses() {
  const { data, error } = await db.from("classes").select("id, name").order("name");
  if (error) return;
  allClasses = data || [];

  const filterSelect = document.getElementById("classFilter");
  const modalSelect = document.getElementById("mClassId");
  
  filterSelect.innerHTML = '<option value="">جميع الأقسام</option>';
  modalSelect.innerHTML = '';

  allClasses.forEach(c => {
    filterSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
    modalSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
  });
}

async function loadStudents() {
  document.getElementById("loadingText").style.display = "block";
  document.getElementById("studentsTable").style.display = "none";

  const { data, error } = await db
    .from("students")
    .select("id, full_name, gender, birth_date, national_id, class_id, status, exit_reason")
    .order("full_name");

  if (error) {
    document.getElementById("loadingText").textContent = "حدث خطأ أثناء تحميل البيانات.";
    return;
  }

  allStudents = data || [];
  renderTable();
}

function renderTable() {
  const selectedClass = document.getElementById("classFilter").value;
  const search = document.getElementById("searchInput").value.trim().toLowerCase();

  const classMap = {};
  allClasses.forEach(c => classMap[c.id] = c.name);

  const filtered = allStudents.filter(s => {
    const matchClass = !selectedClass || s.class_id === selectedClass;
    const matchSearch = !search || (s.full_name && s.full_name.toLowerCase().includes(search));
    return matchClass && matchSearch;
  });

  const body = document.getElementById("studentsBody");
  body.innerHTML = "";

  if (filtered.length === 0) {
    body.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--ink-soft);">لا يوجد تلاميذ للعرض.</td></tr>`;
  } else {
    filtered.forEach(s => {
      const isExited = s.status === 'مغادر';
      body.innerHTML += `
        <tr style="${isExited ? 'opacity:0.6; background:#fff5f5;' : ''}">
          <td>${s.national_id || '-'}</td>
          <td><b>${s.full_name}</b></td>
          <td>${s.gender || '-'}</td>
          <td><span class="status-pill resolved">${classMap[s.class_id] || 'غير محدد'}</span></td>
          <td>${s.birth_date || '-'}</td>
          <td>${isExited ? `<span style="color:#dc2626; font-weight:bold;">مغادر (${s.exit_reason || ''})</span>` : '<span style="color:#16a34a;">مستمر</span>'}</td>
          <td>
            <button class="action-btn" onclick="openEditModal('${s.id}')" title="تعديل">✏️</button>
            <button class="action-btn" onclick="openDeleteModal('${s.id}')" title="شطب/حذف">🗑️</button>
          </td>
        </tr>
      `;
    });
  }

  document.getElementById("loadingText").style.display = "none";
  document.getElementById("studentsTable").style.display = "table";
}

document.getElementById("classFilter").addEventListener("change", renderTable);
document.getElementById("searchInput").addEventListener("input", renderTable);

// --- إدارة Modal الإضافة والتعديل ---
function openAddModal() {
  document.getElementById("modalTitle").textContent = "إضافة تلميذ جديد";
  document.getElementById("editStudentId").value = "";
  document.getElementById("mFullName").value = "";
  document.getElementById("mNationalId").value = "";
  document.getElementById("mBirthDate").value = "";
  document.getElementById("studentModal").style.display = "flex";
}

function openEditModal(id) {
  const s = allStudents.find(x => x.id === id);
  if (!s) return;
  document.getElementById("modalTitle").textContent = "تعديل بيانات تلميذ";
  document.getElementById("editStudentId").value = s.id;
  document.getElementById("mFullName").value = s.full_name;
  document.getElementById("mClassId").value = s.class_id;
  document.getElementById("mGender").value = s.gender || "ذكر";
  document.getElementById("mNationalId").value = s.national_id || "";
  document.getElementById("mBirthDate").value = s.birth_date || "";
  document.getElementById("studentModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("studentModal").style.display = "none";
}

async function saveStudent() {
  const id = document.getElementById("editStudentId").value;
  const full_name = document.getElementById("mFullName").value.trim();
  const class_id = document.getElementById("mClassId").value;
  const gender = document.getElementById("mGender").value;
  const national_id = document.getElementById("mNationalId").value.trim() || null;
  const birth_date = document.getElementById("mBirthDate").value || null;

  if (!full_name || !class_id) {
    alert("يرجى ملء الاسم واللقب واختيار القسم.");
    return;
  }

  const payload = { full_name, class_id, gender, national_id, birth_date, status: 'مستمر' };

  if (id) {
    await db.from("students").update(payload).eq("id", id);
  } else {
    payload.source = 'manual';
    payload.enrollment_date = new Date().toISOString().split('T')[0];
    await db.from("students").insert([payload]);
  }

  closeModal();
  loadStudents();
}

// --- إدارة Modal الشطب / الحذف المتعدد ---
function openDeleteModal(id) {
  document.getElementById("deleteStudentId").value = id;
  document.getElementById("deleteReason").value = "تغيير مؤسسة";
  toggleOtherReasonInput();
  document.getElementById("deleteModal").style.display = "flex";
}

function closeDeleteModal() {
  document.getElementById("deleteModal").style.display = "none";
}

function toggleOtherReasonInput() {
  const val = document.getElementById("deleteReason").value;
  document.getElementById("otherReasonContainer").style.display = (val === "أخرى") ? "block" : "none";
}

async function confirmDeleteStudent() {
  const id = document.getElementById("deleteStudentId").value;
  const reasonType = document.getElementById("deleteReason").value;
  let finalReason = reasonType;

  if (reasonType === "أخرى") {
    finalReason = document.getElementById("customReason").value.trim() || "سبب آخر";
  }

  if (reasonType === "حذف نهائي") {
    if (confirm("هل أنت متأكد من الحذف النهائي للتلميذ من قاعدة البيانات؟")) {
      await db.from("students").delete().eq("id", id);
    }
  } else {
    // تحديث حالة التلميذ لمغادر وتسجيل سبب المغادرة لحركة سبتمبر
    await db.from("students").update({
      status: 'مغادر',
      exit_reason: finalReason,
      exit_date: new Date().toISOString().split('T')[0]
    }).eq("id", id);
  }

  closeDeleteModal();
  loadStudents();
}

// --- طباعة حركة سبتمبر (الوافدون والمغادرون) PDF ---
async function exportSeptemberReportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  
  const classMap = {};
  allClasses.forEach(c => classMap[c.id] = c.name);

  const arrived = allStudents.filter(s => s.source === 'manual' || s.enrollment_date);
  const left = allStudents.filter(s => s.status === 'مغادر');

  let reportHtml = `
    <div dir="rtl" style="font-family: Arial, sans-serif; padding:20px; color:#000;">
      <h2 style="text-align:center;">تقرير حركة التلاميذ لشهر سبتمبر</h2>
      <h4 style="text-align:center;">الوافدون والمغادرون</h4>
      <hr>
      <h3>1. الوافدون الجديد (الجدد):</h3>
      <table border="1" style="width:100%; border-collapse:collapse; margin-bottom:20px; text-align:right;">
        <tr style="background:#eee;">
          <th>الاسم واللقب</th><th>القسم</th><th>تاريخ التسجيل</th>
        </tr>
        ${arrived.length ? arrived.map(a => `<tr><td>${a.full_name}</td><td>${classMap[a.class_id]||'-'}</td><td>${a.enrollment_date||'-'}</td></tr>`).join('') : '<tr><td colspan="3">لا يوجد وافدون</td></tr>'}
      </table>

      <h3>2. المغادرون / المشطوبون:</h3>
      <table border="1" style="width:100%; border-collapse:collapse; text-align:right;">
        <tr style="background:#eee;">
          <th>الاسم واللقب</th><th>القسم</th><th>سبب المغادرة</th>
        </tr>
        ${left.length ? left.map(l => `<tr><td>${l.full_name}</td><td>${classMap[l.class_id]||'-'}</td><td>${l.exit_reason||'-'}</td></tr>`).join('') : '<tr><td colspan="3">لا يوجد مغادرون</td></tr>'}
      </table>
    </div>
  `;

  const container = document.createElement('div');
  container.innerHTML = reportHtml;
  document.body.appendChild(container);

  const canvas = await html2canvas(container);
  const imgData = canvas.toDataURL('image/png');
  doc.addImage(imgData, 'PNG', 10, 10, 190, 0);
  doc.save('تقرير_حركة_سبتمبر.pdf');

  document.body.removeChild(container);
}

init();
</script>
</body>
</html>
