<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قائمة التلاميذ — برنامج الناظر</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-area">
    <div class="topbar">
      <div>
        <div class="t-title">قائمة التلاميذ</div>
        <div class="t-sub">عرض وتعديل بيانات التلاميذ بحسب القسم</div>
      </div>
      <div class="user-chip">
        <span id="userName">...</span>
        <button class="btn-logout" onclick="logout()">خروج</button>
      </div>
    </div>
    
    <div class="page">
      <div class="card" style="margin-bottom:14px; padding:12px 16px;">
        <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
          <div class="field" style="margin:0; min-width:180px;">
            <label style="font-size:11px;">القسم</label>
            <select id="classSelect" onchange="loadStudents()"><option value="">اختر القسم...</option></select>
          </div>
          <div class="field" style="margin:0; flex:1; min-width:180px;">
            <label style="font-size:11px;">بحث باسم التلميذ</label>
            <input type="text" id="searchInput" placeholder="ابحث..." oninput="filterTable()">
          </div>
          <button class="btn-secondary" onclick="exportMovementReportPDF()" style="margin-top:16px;">📄 حركة سبتمبر (PDF)</button>
          <button class="btn-primary" onclick="openModal()" style="margin-top:16px;">➕ إضافة تلميذ</button>
        </div>
      </div>

      <div class="card" style="padding:0; overflow:hidden;">
        <table class="rtable" id="studentsTable">
          <thead>
            <tr>
              <th>#</th>
              <th>رقم التعريف الوطني</th>
              <th>اللقب والاسم</th>
              <th>الجنس</th>
              <th>تاريخ الميلاد</th>
              <th>القسم</th>
              <th>الحالة</th>
              <th style="width:100px;">إجراءات</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="8" style="text-align:center; padding:30px; color:var(--text-sub);">اختر قسمًا لتعريف التلاميذ...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal إضافة / تعديل تلميذ -->
<div class="modal-backdrop" id="studentModal" style="display:none;">
  <div class="modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h3 id="modalTitle" style="margin:0; font-size:16px;">إضافة تلميذ</h3>
      <button onclick="closeModal()" style="background:none; border:none; cursor:pointer; font-size:18px;">✕</button>
    </div>
    <form id="studentForm" onsubmit="saveStudent(event)">
      <input type="hidden" id="studentId">
      <div class="field">
        <label>اللقب والاسم *</label>
        <input type="text" id="fullNameInput" required placeholder="مثال: بن علي محمد">
      </div>
      <div class="field">
        <label>رقم التعريف الوطني (18 رقم)</label>
        <input type="text" id="nationalIdInput" placeholder="اختياري">
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div class="field">
          <label>الجنس</label>
          <select id="genderInput">
            <option value="ذكر">ذكر</option>
            <option value="أنثى">أنثى</option>
          </select>
        </div>
        <div class="field">
          <label>تاريخ الميلاد</label>
          <input type="date" id="birthDateInput">
        </div>
      </div>
      <div class="field">
        <label>القسم *</label>
        <select id="modalClassSelect" required></select>
      </div>
      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:16px;">
        <button type="button" class="btn-secondary" onclick="closeModal()">إلغاء</button>
        <button type="submit" class="btn-primary">حفظ</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal خيارات الحذف والشطب -->
<div class="modal-backdrop" id="deleteModal" style="display:none;">
  <div class="modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="margin:0; font-size:16px; color:#dc2626;">شطب / حذف تلميذ</h3>
      <button onclick="closeDeleteModal()" style="background:none; border:none; cursor:pointer; font-size:18px;">✕</button>
    </div>
    <input type="hidden" id="deleteStudentId">
    
    <div class="field">
      <label>سبب الشطب / المغادرة:</label>
      <select id="deleteReasonSelect" onchange="toggleCustomReason()">
        <option value="تغيير مؤسسة">تغيير مؤسسة (تحويل)</option>
        <option value="التخلي عن الدراسة">التخلي عن الدراسة (انقطاع)</option>
        <option value="حذف نهائي">حذف نهائي من قاعدة البيانات</option>
        <option value="أخرى">أخرى (حدد السبب)</option>
      </select>
    </div>

    <div class="field" id="customReasonBox" style="display:none;">
      <label>أدخل السبب بالتفصيل:</label>
      <input type="text" id="customReasonInput" placeholder="أكتب السبب هنا...">
    </div>

    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:16px;">
      <button type="button" class="btn-secondary" onclick="closeDeleteModal()">إلغاء</button>
      <button type="button" class="btn-primary" style="background:#dc2626;" onclick="confirmDeleteStudent()">تأكيد الشطب</button>
    </div>
  </div>
</div>

<script src="assets/config.js"></script>
<script src="assets/sidebar.js"></script>
<script>
let profile = null;
let allClasses = [];
let allStudents = [];

async function init() {
  // تفعيل الصلاحيات لكل من admin و supervisor
  profile = await requireSession(["admin", "supervisor"]);
  if (!profile) return;
  document.getElementById("userName").textContent = profile.full_name;
  
  renderSidebar("students", profile.role);
  await loadClasses();
}

async function loadClasses() {
  const { data } = await db.from("classes").select("*").order("name");
  allClasses = data || [];
  
  const sel = document.getElementById("classSelect");
  const mSel = document.getElementById("modalClassSelect");
  sel.innerHTML = '<option value="">اختر القسم...</option>';
  mSel.innerHTML = '<option value="">اختر القسم...</option>';
  
  allClasses.forEach(c => {
    sel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
    mSel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
  });
}

async function loadStudents() {
  const classId = document.getElementById("classSelect").value;
  if (!classId) {
    document.getElementById("tableBody").innerHTML = '<tr><td colspan="8" style="text-align:center; padding:30px; color:var(--text-sub);">اختر قسمًا لتعريف التلاميذ...</td></tr>';
    return;
  }
  
  const { data } = await db.from("students").select("*").eq("class_id", classId).order("full_name");
  allStudents = data || [];
  renderTable(allStudents);
}

function renderTable(list) {
  const tbody = document.getElementById("tableBody");
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:30px; color:var(--text-sub);">لا يوجد تلاميذ في هذا القسم</td></tr>';
    return;
  }
  
  const classMap = Object.fromEntries(allClasses.map(c => [c.id, c.name]));
  
  tbody.innerHTML = list.map((s, i) => {
    const isExited = s.status === 'مغادر';
    return `
      <tr style="${isExited ? 'opacity:0.6; background:rgba(220,38,38,0.05);' : ''}">
        <td>${i + 1}</td>
        <td>${s.national_id || '—'}</td>
        <td><b>${s.full_name}</b></td>
        <td>${s.gender || '—'}</td>
        <td>${s.birth_date || '—'}</td>
        <td>${classMap[s.class_id] || '—'}</td>
        <td>${isExited ? `<span style="color:#dc2626; font-weight:bold;">مغادر (${s.exit_reason || ''})</span>` : '<span style="color:#16a34a;">مستمر</span>'}</td>
        <td>
          <button class="btn-icon" onclick="editStudent('${s.id}')" title="تعديل">✏️</button>
          <button class="btn-icon" onclick="openDeleteModal('${s.id}')" title="شطب/حذف" style="color:#dc2626;">🗑️</button>
        </td>
      </tr>
    `;
  }).join('');
}

function filterTable() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  if (!q) { renderTable(allStudents); return; }
  const filtered = allStudents.filter(s => s.full_name.toLowerCase().includes(q) || (s.national_id && s.national_id.includes(q)));
  renderTable(filtered);
}

function openModal(id = null) {
  document.getElementById("studentId").value = id || '';
  document.getElementById("modalTitle").textContent = id ? 'تعديل تلميذ' : 'إضافة تلميذ';
  if (!id) {
    document.getElementById("studentForm").reset();
    document.getElementById("modalClassSelect").value = document.getElementById("classSelect").value;
  }
  document.getElementById("studentModal").style.display = 'flex';
}

function closeModal() { document.getElementById("studentModal").style.display = 'none'; }

function editStudent(id) {
  const s = allStudents.find(x => x.id === id);
  if (!s) return;
  document.getElementById("studentId").value = s.id;
  document.getElementById("fullNameInput").value = s.fullName || s.full_name;
  document.getElementById("nationalIdInput").value = s.national_id || '';
  document.getElementById("genderInput").value = s.gender || 'ذكر';
  document.getElementById("birthDateInput").value = s.birth_date || '';
  document.getElementById("modalClassSelect").value = s.class_id;
  document.getElementById("modalTitle").textContent = 'تعديل تلميذ';
  document.getElementById("studentModal").style.display = 'flex';
}

async function saveStudent(e) {
  e.preventDefault();
  const id = document.getElementById("studentId").value;
  const payload = {
    full_name: document.getElementById("fullNameInput").value.trim(),
    national_id: document.getElementById("nationalIdInput").value.trim() || null,
    gender: document.getElementById("genderInput").value,
    birth_date: document.getElementById("birthDateInput").value || null,
    class_id: document.getElementById("modalClassSelect").value,
    status: 'مستمر'
  };
  
  if (id) {
    await db.from("students").update(payload).eq("id", id);
  } else {
    payload.source = 'manual';
    payload.enrollment_date = new Date().toISOString().split('T')[0];
    await db.from("students").insert([payload]);
  }
  
  closeModal();
  loadStudents();
}

// --- إدارة الشطب والحذف ---
function openDeleteModal(id) {
  document.getElementById("deleteStudentId").value = id;
  document.getElementById("deleteReasonSelect").value = "تغيير مؤسسة";
  toggleCustomReason();
  document.getElementById("deleteModal").style.display = "flex";
}

function closeDeleteModal() { document.getElementById("deleteModal").style.display = "none"; }

function toggleCustomReason() {
  const val = document.getElementById("deleteReasonSelect").value;
  document.getElementById("customReasonBox").style.display = (val === "أخرى") ? "block" : "none";
}

async function confirmDeleteStudent() {
  const id = document.getElementById("deleteStudentId").value;
  const reasonType = document.getElementById("deleteReasonSelect").value;
  let finalReason = reasonType;

  if (reasonType === "أخرى") {
    finalReason = document.getElementById("customReasonInput").value.trim() || "سبب آخر";
  }

  if (reasonType === "حذف نهائي") {
    if (confirm("هل أنت متأكد من الحذف النهائي للتلميذ من قاعدة البيانات؟")) {
      await db.from("students").delete().eq("id", id);
    }
  } else {
    await db.from("students").update({
      status: 'مغادر',
      exit_reason: finalReason,
      exit_date: new Date().toISOString().split('T')[0]
    }).eq("id", id);
  }

  closeDeleteModal();
  loadStudents();
}

// --- طباعة حركة سبتمبر ---
async function exportMovementReportPDF() {
  const { data: students } = await db.from("students").select("*");
  const classMap = Object.fromEntries(allClasses.map(c => [c.id, c.name]));
  
  const arrived = (students || []).filter(s => s.source === 'manual' || s.enrollment_date);
  const left = (students || []).filter(s => s.status === 'مغادر');

  const element = document.createElement('div');
  element.style.padding = '20px';
  element.style.direction = 'rtl';
  element.style.fontFamily = 'Arial, sans-serif';
  
  element.innerHTML = `
    <h2 style="text-align:center;">تقرير حركة التلاميذ لشهر سبتمبر</h2>
    <hr>
    <h3>أولاً: الوافدون (الجدد)</h3>
    <table border="1" style="width:100%; border-collapse:collapse; text-align:right; margin-bottom:20px;">
      <thead><tr style="background:#f3f4f6;"><th>اللقب والاسم</th><th>القسم</th><th>تاريخ التسجيل</th></tr></thead>
      <tbody>
        ${arrived.length ? arrived.map(s => `<tr><td>${s.full_name}</td><td>${classMap[s.class_id] || '-'}</td><td>${s.enrollment_date || '-'}</td></tr>`).join('') : '<tr><td colspan="3" style="text-align:center;">لا يوجد</td></tr>'}
      </tbody>
    </table>

    <h3>ثانياً: المغادرون (المشطوبون)</h3>
    <table border="1" style="width:100%; border-collapse:collapse; text-align:right;">
      <thead><tr style="background:#f3f4f6;"><th>اللقب والاسم</th><th>القسم</th><th>سبب المغادرة</th></tr></thead>
      <tbody>
        ${left.length ? left.map(s => `<tr><td>${s.full_name}</td><td>${classMap[s.class_id] || '-'}</td><td>${s.exit_reason || '-'}</td></tr>`).join('') : '<tr><td colspan="3" style="text-align:center;">لا يوجد</td></tr>'}
      </tbody>
    </table>
  `;

  html2pdf().set({
    margin: 10,
    filename: 'حركة_سبتمبر.pdf',
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  }).from(element).save();
}

init();
</script>
</body>
</html>
