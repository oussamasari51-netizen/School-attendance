<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة التلاميذ — نظام الغيابات</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="icon">👥</div>
    <div>
      <h1>إدارة التلاميذ</h1>
      <div class="meta">حذف/إعادة تفعيل تلميذ من قسم</div>
    </div>
  </div>
  <div class="user-chip">
    <span id="adminName">...</span>
    <a href="census.html" style="color:#fff; text-decoration:none; font-size:13px; margin-left:10px;">📊 الحساب الدوري</a>
    <a href="admin.html" style="color:#fff; text-decoration:none; font-size:13px; margin-left:10px;">⟵ لوحة الناظر</a>
    <button onclick="logout()">خروج</button>
  </div>
</div>

<div class="page" style="max-width:760px;">

  <div class="section-title" style="margin-top:0;">اختر القسم</div>
  <div class="grid" id="classGrid">
    <div class="loading-text">جاري التحميل...</div>
  </div>

  <div id="studentSection" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin:22px 0 10px; flex-wrap:wrap; gap:10px;">
      <div class="section-title" id="classTitle" style="margin:0;"></div>
      <div style="display:flex; align-items:center; gap:14px;">
        <label style="display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft);">
          <input type="checkbox" id="showInactive"> إظهار المنسحبين أيضاً
        </label>
        <button class="btn-primary" id="addStudentBtn" style="padding:9px 16px; font-size:13px;">+ إضافة تلميذ</button>
      </div>
    </div>
    <div class="student-list" id="studentList"></div>
  </div>

</div>

<!-- نافذة إضافة تلميذ -->
<div class="modal-backdrop" id="addModal">
  <div class="modal-sheet">
    <h3>إضافة تلميذ جديد</h3>
    <p class="msub" id="addModalSub"></p>
    <div class="field">
      <label>الاسم الكامل</label>
      <input type="text" id="newStudentName" placeholder="اللقب والاسم">
    </div>
    <div class="field">
      <label>تاريخ التسجيل</label>
      <input type="date" id="newStudentDate">
    </div>
    <button class="btn-primary" id="confirmAddBtn" style="width:100%; margin-top:8px;">إضافة</button>
    <div class="modal-close-row">
      <button class="btn-ghost" onclick="closeAddModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- نافذة تغيير القسم -->
<div class="modal-backdrop" id="moveModal">
  <div class="modal-sheet">
    <h3 id="moveModalTitle"></h3>
    <p class="msub">اختر القسم الجديد</p>
    <div class="option-list" id="moveOptionList"></div>
    <div class="modal-close-row">
      <button class="btn-ghost" onclick="closeMoveModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- نافذة سبب الخروج -->
<div class="modal-backdrop" id="withdrawModal">
  <div class="modal-sheet">
    <h3 id="withdrawModalTitle"></h3>
    <p class="msub">اختر سبب الخروج وتاريخه</p>
    <div class="field">
      <label>السبب</label>
      <select id="withdrawReason">
        <option value="تحويل مؤسسة">تحويل مؤسسة</option>
        <option value="انقطاع عن الدراسة">انقطاع عن الدراسة</option>
        <option value="أخرى">أخرى</option>
      </select>
    </div>
    <div class="field">
      <label>تاريخ الخروج</label>
      <input type="date" id="withdrawDate">
    </div>
    <button class="btn-primary" id="confirmWithdrawBtn" style="width:100%; margin-top:8px; background:var(--absent);">تأكيد الحذف من القسم</button>
    <div class="modal-close-row">
      <button class="btn-ghost" onclick="closeWithdrawModal()">إلغاء</button>
    </div>
  </div>
</div>

<script src="assets/config.js"></script>
<script>
let profile = null;
let selectedClass = null;
let allClasses = [];

async function init() {
  profile = await requireSession("admin");
  if (!profile) return;
  document.getElementById("adminName").textContent = profile.full_name;

  const { data: classes } = await db.from("classes").select("id, name").order("name");
  allClasses = classes || [];
  const grid = document.getElementById("classGrid");
  grid.innerHTML = "";
  allClasses.forEach(c => {
    const card = document.createElement("div");
    card.className = "class-card";
    card.innerHTML = `<div class="cname">${c.name}</div><div class="stat zero"><span class="txt">اضغط لعرض التلاميذ</span></div>`;
    card.onclick = () => selectClass(c);
    grid.appendChild(card);
  });
}

async function selectClass(cls) {
  selectedClass = cls;
  document.getElementById("studentSection").style.display = "block";
  document.getElementById("classTitle").textContent = `تلاميذ ${cls.name}`;
  await renderStudents();
  document.getElementById("studentSection").scrollIntoView({ behavior: "smooth" });
}

document.getElementById("showInactive").addEventListener("change", renderStudents);

async function renderStudents() {
  if (!selectedClass) return;
  const list = document.getElementById("studentList");
  list.innerHTML = `<div class="loading-text">جاري التحميل...</div>`;

  const showInactive = document.getElementById("showInactive").checked;
  let query = db.from("students").select("id, full_name, active, enrollment_date, withdrawal_date, withdrawal_reason").eq("class_id", selectedClass.id).order("full_name");
  if (!showInactive) query = query.eq("active", true);
  const { data: students } = await query;

  if (!students || students.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">👤</div>لا يوجد تلاميذ لعرضهم.</div>`;
    return;
  }

  list.innerHTML = "";
  students.forEach(s => {
    const row = document.createElement("div");
    row.className = "student-row";
    const subInfo = !s.active && s.withdrawal_date
      ? `<div class="sinfo">${s.withdrawal_reason || ""} — ${s.withdrawal_date}</div>` : "";
    row.innerHTML = `
      <div>
        <div class="sname" style="${s.active ? "" : "text-decoration:line-through; color:var(--ink-soft);"}">${s.full_name}</div>
        ${subInfo}
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        ${!s.active ? `<span class="status-pill pending-exit">منسحب</span>` : ""}
        ${s.active ? `<button class="btn-ghost move-btn" style="padding:7px 12px; font-size:12.5px;">تغيير القسم</button>` : ""}
        <button class="btn-ghost" style="padding:7px 14px; font-size:12.5px; ${s.active ? "color:var(--absent); background:var(--absent-light);" : "color:var(--resolved); background:var(--resolved-light);"}">
          ${s.active ? "حذف من القسم" : "إعادة تفعيل"}
        </button>
      </div>
    `;
    row.querySelector("button:last-child").onclick = () => toggleActive(s);
    const moveBtn = row.querySelector(".move-btn");
    if (moveBtn) moveBtn.onclick = () => openMoveModal(s);
    list.appendChild(row);
  });
}

async function toggleActive(student) {
  if (student.active) {
    document.getElementById("withdrawModalTitle").textContent = `حذف "${student.full_name}" من القسم`;
    document.getElementById("withdrawDate").value = todayISO();
    document.getElementById("withdrawDate").max = todayISO();
    document.getElementById("withdrawReason").value = "تحويل مؤسسة";
    window.__withdrawTarget = student;
    document.getElementById("withdrawModal").classList.add("open");
    return;
  }
  // إعادة تفعيل مباشرة
  const { error } = await db.from("students").update({ active: true, withdrawal_date: null, withdrawal_reason: null }).eq("id", student.id);
  if (error) { showToast("حدث خطأ"); return; }
  showToast("تمت إعادة التفعيل");
  renderStudents();
}

function closeWithdrawModal() { document.getElementById("withdrawModal").classList.remove("open"); }
document.getElementById("withdrawModal").addEventListener("click", (e) => { if (e.target.id === "withdrawModal") closeWithdrawModal(); });

document.getElementById("confirmWithdrawBtn").addEventListener("click", async () => {
  const student = window.__withdrawTarget;
  if (!student) return;
  const reason = document.getElementById("withdrawReason").value;
  const date = document.getElementById("withdrawDate").value || todayISO();
  const { error } = await db.from("students")
    .update({ active: false, withdrawal_date: date, withdrawal_reason: reason })
    .eq("id", student.id);
  closeWithdrawModal();
  if (error) { showToast("حدث خطأ"); return; }
  showToast("تم حذف التلميذ من القسم");
  renderStudents();
});

// ===== إضافة تلميذ =====
document.getElementById("addStudentBtn").addEventListener("click", () => {
  document.getElementById("addModalSub").textContent = `سيُضاف إلى قسم ${selectedClass.name}`;
  document.getElementById("newStudentName").value = "";
  document.getElementById("newStudentDate").value = todayISO();
  document.getElementById("newStudentDate").max = todayISO();
  document.getElementById("addModal").classList.add("open");
});
function closeAddModal() { document.getElementById("addModal").classList.remove("open"); }
document.getElementById("addModal").addEventListener("click", (e) => { if (e.target.id === "addModal") closeAddModal(); });

document.getElementById("confirmAddBtn").addEventListener("click", async () => {
  const name = document.getElementById("newStudentName").value.trim();
  if (!name) { showToast("اكتب اسم التلميذ أولاً"); return; }
  const btn = document.getElementById("confirmAddBtn");
  btn.disabled = true; btn.textContent = "جاري الإضافة...";

  const enrollDate = document.getElementById("newStudentDate").value || todayISO();
  const { error } = await db.from("students").insert({ full_name: name, class_id: selectedClass.id, active: true, enrollment_date: enrollDate });

  btn.disabled = false; btn.textContent = "إضافة";
  if (error) { showToast("حدث خطأ أثناء الإضافة"); return; }
  showToast("تمت إضافة التلميذ بنجاح ✓");
  closeAddModal();
  renderStudents();
});

// ===== تغيير القسم =====
let movingStudent = null;
function openMoveModal(student) {
  movingStudent = student;
  document.getElementById("moveModalTitle").textContent = `نقل "${student.full_name}"`;
  const list = document.getElementById("moveOptionList");
  list.innerHTML = "";
  allClasses.filter(c => c.id !== selectedClass.id).forEach(c => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = c.name;
    btn.onclick = () => confirmMove(c);
    list.appendChild(btn);
  });
  document.getElementById("moveModal").classList.add("open");
}
function closeMoveModal() { document.getElementById("moveModal").classList.remove("open"); }
document.getElementById("moveModal").addEventListener("click", (e) => { if (e.target.id === "moveModal") closeMoveModal(); });

async function confirmMove(newClass) {
  const { error } = await db.from("students").update({ class_id: newClass.id }).eq("id", movingStudent.id);
  closeMoveModal();
  if (error) { showToast("حدث خطأ أثناء النقل"); return; }
  showToast(`تم نقل التلميذ إلى ${newClass.name}`);
  renderStudents();
}

init();
</script>
<div class="app-footer">© جميع الحقوق محفوظة — OUSSAMA SARI 2026</div>
</body>
</html>
