<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة التلاميذ — نظام الغيابات</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .filter-bar { display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
  .filter-bar select, .filter-bar input { padding:8px 12px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; }
  table.rtable { width:100%; border-collapse:collapse; font-size:13.5px; background:var(--surface); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
  table.rtable th, table.rtable td { padding:10px 12px; text-align:right; border-bottom:1px solid var(--paper); }
  table.rtable th { color:var(--ink-soft); font-size:12.5px; background:var(--primary-light); }
  .action-btn { border:none; background:none; cursor:pointer; font-size:15px; padding:4px 6px; }
</style>
</head>
<body>

<div class="app-shell">
<div id="sidebarMount"></div>
<div class="main-area">

<div class="topbar">
  <div class="brand">
    <div class="icon">👥</div>
    <div>
      <h1>إدارة قائمة التلاميذ</h1>
      <div class="meta">عرض، بحث، وإضافة التلاميذ والأقسام</div>
    </div>
  </div>
  <div class="user-chip">
    <span id="userName">...</span>
    <button onclick="logout()">خروج</button>
  </div>
</div>

<div class="page">

  <div class="filter-bar">
    <label><b>القسم:</b></label>
    <select id="classFilter">
      <option value="">جميع الأقسام</option>
    </select>

    <label><b>البحث:</b></label>
    <input type="text" id="searchInput" placeholder="ابحث باسم التلميذ...">

    <div style="margin-right:auto;" id="adminActions">
      <button class="btn-primary" onclick="openAddModal()">➕ إضافة تلميذ جديد</button>
    </div>
  </div>

  <div id="loadingText" class="loading-text">جاري تحميل قائمة التلاميذ...</div>

  <table class="rtable" id="studentsTable" style="display:none;">
    <thead>
      <tr>
        <th>رقم التعريف</th>
        <th>الاسم واللقب</th>
        <th>الجنس</th>
        <th>القسم</th>
        <th>تاريخ الازدياد</th>
        <th id="thActions">إجراءات</th>
      </tr>
    </thead>
    <tbody id="studentsBody"></tbody>
  </table>

</div>

</div><!-- /main-area -->
</div><!-- /app-shell -->

<!-- Modal إضافة / تعديل تلميذ -->
<div id="studentModal" class="modal-backdrop" style="display:none;">
  <div class="modal-card">
    <h2 id="modalTitle">إضافة تلميذ جديد</h2>
    <input type="hidden" id="editStudentId">
    
    <div style="margin-top:12px;">
      <label>الاسم واللقب:</label>
      <input type="text" id="mFullName" class="input-field" placeholder="مثال: محمد بلقاسم">
    </div>

    <div style="margin-top:10px;">
      <label>القسم:</label>
      <select id="mClassId" class="input-field"></select>
    </div>

    <div style="margin-top:10px;">
      <label>الجنس:</label>
      <select id="mGender" class="input-field">
        <option value="ذكر">ذكر</option>
        <option value="أنثى">أنثى</option>
      </select>
    </div>

    <div style="margin-top:10px;">
      <label>رقم التعريف الوطني:</label>
      <input type="text" id="mNationalId" class="input-field" placeholder="اختياري">
    </div>

    <div style="margin-top:10px;">
      <label>تاريخ الازدياد:</label>
      <input type="date" id="mBirthDate" class="input-field">
    </div>

    <div style="display:flex; gap:10px; margin-top:18px;">
      <button class="btn-primary" onclick="saveStudent()">حفظ</button>
      <button class="btn-secondary" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<script src="assets/config.js"></script>
<script src="assets/sidebar.js"></script>
<script>renderSidebar("students");</script>
<script>
let profile = null;
let allClasses = [];
let allStudents = [];

async function init() {
  profile = await requireSession(["admin", "supervisor"]);
  if (!profile) return;
  document.getElementById("userName").textContent = profile.full_name;

  if (profile.role !== "admin") {
    const adminActions = document.getElementById("adminActions");
    if (adminActions) adminActions.style.display = "none";
    const thActions = document.getElementById("thActions");
    if (thActions) thActions.style.display = "none";
  }

  await loadClasses();
  await loadStudents();
}

async function loadClasses() {
  const { data, error } = await db.from("classes").select("id, name").order("name");
  if (error) {
    console.error("Error loading classes:", error);
    return;
  }
  allClasses = data || [];

  const filterSelect = document.getElementById("classFilter");
  const modalSelect = document.getElementById("mClassId");
  
  filterSelect.innerHTML = '<option value="">جميع الأقسام</option>';
  modalSelect.innerHTML = '';

  allClasses.forEach(c => {
    filterSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
    modalSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
  });
}

async function loadStudents() {
  document.getElementById("loadingText").style.display = "block";
  document.getElementById("studentsTable").style.display = "none";

  const { data, error } = await db
    .from("students")
    .select("id, full_name, gender, birth_date, national_id, class_id")
    .order("full_name");

  if (error) {
    console.error("Error loading students:", error);
    document.getElementById("loadingText").textContent = "حدث خطأ أثناء تحميل البيانات.";
    return;
  }

  allStudents = data || [];
  renderTable();
}

function renderTable() {
  const selectedClass = document.getElementById("classFilter").value;
  const search = document.getElementById("searchInput").value.trim().toLowerCase();

  const classMap = {};
  allClasses.forEach(c => classMap[c.id] = c.name);

  const filtered = allStudents.filter(s => {
    const matchClass = !selectedClass || s.class_id === selectedClass;
    const matchSearch = !search || (s.full_name && s.full_name.toLowerCase().includes(search));
    return matchClass && matchSearch;
  });

  const body = document.getElementById("studentsBody");
  body.innerHTML = "";

  if (filtered.length === 0) {
    body.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--ink-soft);">لا يوجد تلاميذ للعرض.</td></tr>`;
  } else {
    filtered.forEach(s => {
      const actionsHtml = profile.role === "admin" ? `
        <td>
          <button class="action-btn" onclick="openEditModal('${s.id}')" title="تعديل">✏️</button>
          <button class="action-btn" onclick="deleteStudent('${s.id}')" title="حذف">🗑️</button>
        </td>` : '';

      body.innerHTML += `
        <tr>
          <td>${s.national_id || '-'}</td>
          <td><b>${s.full_name}</b></td>
          <td>${s.gender || '-'}</td>
          <td><span class="status-pill resolved">${classMap[s.class_id] || 'غير محدد'}</span></td>
          <td>${s.birth_date || '-'}</td>
          ${actionsHtml}
        </tr>
      `;
    });
  }

  document.getElementById("loadingText").style.display = "none";
  document.getElementById("studentsTable").style.display = "table";
}

document.getElementById("classFilter").addEventListener("change", renderTable);
document.getElementById("searchInput").addEventListener("input", renderTable);

function openAddModal() {
  document.getElementById("modalTitle").textContent = "إضافة تلميذ جديد";
  document.getElementById("editStudentId").value = "";
  document.getElementById("mFullName").value = "";
  document.getElementById("mNationalId").value = "";
  document.getElementById("mBirthDate").value = "";
  document.getElementById("studentModal").style.display = "flex";
}

function openEditModal(id) {
  const s = allStudents.find(x => x.id === id);
  if (!s) return;
  document.getElementById("modalTitle").textContent = "تعديل بيانات تلميذ";
  document.getElementById("editStudentId").value = s.id;
  document.getElementById("mFullName").value = s.full_name;
  document.getElementById("mClassId").value = s.class_id;
  document.getElementById("mGender").value = s.gender || "ذكر";
  document.getElementById("mNationalId").value = s.national_id || "";
  document.getElementById("mBirthDate").value = s.birth_date || "";
  document.getElementById("studentModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("studentModal").style.display = "none";
}

async function saveStudent() {
  const id = document.getElementById("editStudentId").value;
  const full_name = document.getElementById("mFullName").value.trim();
  const class_id = document.getElementById("mClassId").value;
  const gender = document.getElementById("mGender").value;
  const national_id = document.getElementById("mNationalId").value.trim() || null;
  const birth_date = document.getElementById("mBirthDate").value || null;

  if (!full_name || !class_id) {
    alert("يرجى ملء الاسم واللقب واختيار القسم.");
    return;
  }

  const payload = { full_name, class_id, gender, national_id, birth_date, source: 'manual', enrollment_date: new Date().toISOString().split('T')[0] };

  if (id) {
    delete payload.source;
    delete payload.enrollment_date;
    await db.from("students").update(payload).eq("id", id);
  } else {
    await db.from("students").insert([payload]);
  }

  closeModal();
  loadStudents();
}

async function deleteStudent(id) {
  if (!confirm("هل أنت متأكد من حذف هذا التلميذ؟")) return;
  await db.from("students").delete().eq("id", id);
  loadStudents();
}

init();
</script>
<div class="app-footer">© جميع الحقوق محفوظة — OUSSAMA SARI 2026</div>
</body>
</html>
