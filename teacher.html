<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الغياب — نظام الغيابات</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="icon">📋</div>
    <div>
      <h1>تسجيل الغياب</h1>
      <div class="meta" id="dateLabel"></div>
    </div>
  </div>
  <div class="user-chip">
    <span id="teacherName">...</span>
    <button onclick="logout()">خروج</button>
  </div>
</div>

<div class="page">

  <div class="periods-rail">
    <div class="rail-head">
      <h2>اختر الحصة</h2>
      <input type="date" id="datePicker" class="datepick-inline">
    </div>
    <div class="rail-track" id="railTrack"></div>
  </div>

  <div class="section-title" id="gridTitle">اختر القسم</div>
  <div class="grid" id="classGrid">
    <div class="loading-text">جاري تحميل الأقسام...</div>
  </div>

  <div id="classSection" style="display:none;">
    <div class="section-title" id="classTitle"></div>
    <div class="student-list" id="studentList"></div>
    <div style="margin-top:18px; display:flex; gap:10px; justify-content:flex-start;">
      <button class="btn-primary" id="submitBtn">إرسال الغيابات</button>
      <button class="btn-ghost" id="backBtn">رجوع لاختيار قسم آخر</button>
    </div>
  </div>

</div>

<script src="assets/config.js"></script>
<script>
let profile = null;
let selectedSlot = null;
let selectedClass = null;
let selectedDate = null;
let classesCache = [];
let currentStudents = [];
let checkedIds = new Set();

const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

function fmtDateOf(iso) {
  const d = new Date(iso + "T00:00:00");
  return `${dayNames[d.getDay()]} — ${d.toLocaleDateString("ar-DZ")}`;
}

async function init() {
  profile = await requireSession("teacher");
  if (!profile) return;

  document.getElementById("teacherName").textContent = profile.full_name;
  selectedDate = todayISO();
  const picker = document.getElementById("datePicker");
  picker.value = selectedDate;
  picker.max = todayISO(); // لا يمكن تسجيل غياب ليوم لم يأتِ بعد
  picker.addEventListener("change", onDateChange);

  const { data: classes } = await db.from("classes").select("id, name").order("name");
  classesCache = classes || [];

  loadDay();
}

function onDateChange() {
  selectedDate = document.getElementById("datePicker").value || todayISO();
  selectedClass = null;
  document.getElementById("classSection").style.display = "none";
  loadDay();
}

function loadDay() {
  document.getElementById("dateLabel").textContent = fmtDateOf(selectedDate);

  const dayPeriods = getPeriodsForDay(selectedDate);
  document.querySelector(".periods-rail").style.display = "block";
  if (dayPeriods.length === 0) {
    document.getElementById("gridTitle").textContent = "عطلة في هذا اليوم";
    document.getElementById("classGrid").innerHTML = `<div class="empty-state"><div class="icon">🏖️</div>لا حصص مبرمجة في هذا اليوم.</div>`;
    document.getElementById("railTrack").innerHTML = "";
    return;
  }

  let target = null;
  if (selectedDate === todayISO()) {
    target = dayPeriods.find(p => {
      const now = new Date(); const nowMin = now.getHours()*60+now.getMinutes();
      const [s,e] = p.time.split(/[–-]/).map(t => { const [h,m]=t.trim().split(":").map(Number); return h*60+m; });
      return nowMin >= s && nowMin <= e;
    });
  }
  selectedSlot = target ? target.slot : dayPeriods[0].slot;
  renderRail();
  document.getElementById("gridTitle").textContent = "اختر القسم";
  renderClassGrid();
}

function renderRail() {
  const track = document.getElementById("railTrack");
  track.innerHTML = "";
  getPeriodsForDay(selectedDate).forEach(p => {
    const btn = document.createElement("button");
    btn.className = "rail-stop" + (selectedSlot === p.slot ? " active" : "");
    btn.innerHTML = `<div class="dot"></div><div class="label">${p.label}</div>`;
    btn.onclick = () => { selectedSlot = p.slot; renderRail(); if (selectedClass) selectClass(selectedClass); };
    track.appendChild(btn);
  });
}

function renderClassGrid() {
  const grid = document.getElementById("classGrid");
  grid.innerHTML = "";
  if (classesCache.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">🏫</div>لم تُضف الأقسام بعد. تواصل مع الإدارة.</div>`;
    return;
  }
  classesCache.forEach(c => {
    const card = document.createElement("div");
    card.className = "class-card";
    card.innerHTML = `<div class="cname">${c.name}</div><div class="stat zero"><span class="txt">اضغط لتسجيل الغياب</span></div>`;
    card.onclick = () => selectClass(c);
    grid.appendChild(card);
  });
}

async function selectClass(cls) {
  selectedClass = cls;
  document.getElementById("classSection").style.display = "block";
  const p = PERIODS.find(x => x.slot === selectedSlot);
  document.getElementById("classTitle").textContent =
    `${cls.name} — الحصة ${selectedSlot}${p ? " (" + p.time + ")" : ""}`;

  const { data: students, error } = await db
    .from("students")
    .select("id, full_name")
    .eq("class_id", cls.id)
    .eq("active", true)
    .order("full_name");

  if (error) { showToast("خطأ في تحميل التلاميذ"); return; }
  currentStudents = students || [];

  const { data: existing } = await db
    .from("attendance_records")
    .select("student_id, status")
    .eq("class_id", cls.id)
    .eq("record_date", selectedDate)
    .eq("hour_slot", selectedSlot);

  checkedIds = new Set((existing || []).filter(r => r.status === "غائب").map(r => r.student_id));
  window.__existingRecords = existing || [];

  renderStudentList();
  document.getElementById("classSection").scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderStudentList() {
  const list = document.getElementById("studentList");
  list.innerHTML = "";
  if (currentStudents.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">👥</div>لا يوجد تلاميذ في هذا القسم بعد.</div>`;
    return;
  }
  currentStudents.forEach(s => {
    const existingRec = (window.__existingRecords || []).find(r => r.student_id === s.id);
    const isOtherStatus = existingRec && existingRec.status !== "غائب";
    const row = document.createElement("div");
    row.className = "student-row";
    row.innerHTML = `
      <div class="check-toggle ${checkedIds.has(s.id) ? "checked" : ""}" data-id="${s.id}">
        ${checkedIds.has(s.id) ? "✓" : ""}
      </div>
      <div style="flex:1; margin-right:12px;">
        <div class="sname">${s.full_name}</div>
      </div>
      ${isOtherStatus ? `<span class="status-pill pending-exit">${existingRec.status}</span>` : ""}
    `;
    const toggle = row.querySelector(".check-toggle");
    if (!isOtherStatus) {
      toggle.style.cursor = "pointer";
      toggle.onclick = () => {
        if (checkedIds.has(s.id)) checkedIds.delete(s.id);
        else checkedIds.add(s.id);
        renderStudentList();
      };
    } else {
      toggle.style.opacity = "0.3";
    }
    list.appendChild(row);
  });
}

document.getElementById("backBtn").addEventListener("click", () => {
  document.getElementById("classSection").style.display = "none";
  selectedClass = null;
  window.scrollTo({ top: 0, behavior: "smooth" });
});

document.getElementById("submitBtn").addEventListener("click", async () => {
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "جاري الإرسال...";

  const classId = selectedClass.id;
  const date = selectedDate;
  const existing = window.__existingRecords || [];

  const toInsert = [];
  const toDelete = [];

  currentStudents.forEach(s => {
    const rec = existing.find(r => r.student_id === s.id);
    const isChecked = checkedIds.has(s.id);
    if (isChecked && !rec) {
      toInsert.push({
        student_id: s.id, class_id: classId, record_date: date,
        hour_slot: selectedSlot, status: "غائب", recorded_by: profile.id
      });
    } else if (!isChecked && rec && rec.status === "غائب") {
      toDelete.push(s.id);
    }
  });

  if (toInsert.length > 0) {
    const { error } = await db.from("attendance_records").insert(toInsert);
    if (error) { showToast("خطأ أثناء الحفظ"); btn.disabled = false; btn.textContent = "إرسال الغيابات"; return; }
  }
  if (toDelete.length > 0) {
    await db.from("attendance_records")
      .delete()
      .eq("class_id", classId).eq("record_date", date).eq("hour_slot", selectedSlot)
      .eq("status", "غائب")
      .in("student_id", toDelete);
  }

  showToast("تم إرسال الغيابات بنجاح ✓");
  btn.disabled = false;
  btn.textContent = "إرسال الغيابات";
  selectClass(selectedClass);
});

init();
</script>
</body>
</html>
