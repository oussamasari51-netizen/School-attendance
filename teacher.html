<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الغياب — شبكة اليوم الكامل</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* تحسين التجاوب مع الهاتف */
  @media (max-width: 600px) {
    .topbar { flex-direction: column; align-items: flex-start; gap: 8px; padding: 10px 12px; }
    .topbar .user-chip { align-self: flex-end; margin-top: -30px; }
    .toolbar-card { flex-direction: column; gap: 8px; padding: 10px; }
    .toolbar-card > div { width: 100% !important; min-width: 100% !important; }
  }

  /* تثبيت عمود الأسماء عند التمرير الأفقي */
  .matrix-table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; }
  .matrix-table { width: 100%; border-collapse: separate; border-spacing: 0 4px; min-width: 600px; }
  .matrix-table th { background: var(--paper, #f1f5f9); padding: 8px; font-size: 12px; color: var(--ink-soft, #475569); border-bottom: 2px solid var(--line, #cbd5e1); text-align: center; }
  
  .matrix-table th:first-child,
  .matrix-table td:first-child {
    position: sticky;
    right: 0;
    z-index: 2;
    background: var(--surface, #ffffff);
    box-shadow: -2px 0 5px rgba(0,0,0,0.05);
    min-width: 140px;
    max-width: 160px;
    text-align: right;
    padding: 8px 10px;
    font-weight: bold;
    font-size: 13px;
  }

  .matrix-table td { background: var(--surface, #ffffff); padding: 6px; text-align: center; vertical-align: middle; }
  
  .slot-btn {
    width: 36px; height: 36px; border-radius: 8px; border: none; font-weight: bold; font-size: 12px; cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease; display: inline-flex; align-items: center; justify-content: center; margin: 0 1px;
  }
  .slot-btn:active { transform: scale(0.92); }
  .slot-btn.present { background: #22c55e; color: #fff; }
  .slot-btn.absent { background: #ef4444; color: #fff; }
  .slot-btn.resolved { background: #f59e0b; color: #fff; }
  
  .toolbar-card { background: var(--surface, #ffffff); border: 1px solid var(--line, #e2e8f0); border-radius: 12px; padding: 12px; margin-bottom: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="icon">📋</div>
    <div>
      <h1 style="font-size: 1.1rem;">تسجيل الغياب</h1>
      <div class="meta" id="dateLabel" style="font-size: 0.8rem;"></div>
    </div>
  </div>
  <div class="user-chip">
    <span id="teacherName">...</span>
    <button onclick="logout()">خروج</button>
  </div>
</div>

<div class="page" style="padding: 10px;">

  <div class="toolbar-card">
    <div style="flex:1; min-width:130px;">
      <label style="font-size:11px; font-weight:bold; color:var(--ink-soft,#64748b); display:block; margin-bottom:2px;">التاريخ</label>
      <input type="date" id="datePicker" class="datepick-inline" style="width:100%; padding: 6px;">
    </div>

    <div style="flex:1; min-width:150px;">
      <label style="font-size:11px; font-weight:bold; color:var(--ink-soft,#64748b); display:block; margin-bottom:2px;">القسم</label>
      <select id="classSelector" style="padding: 6px;">
        <option value="">اختر القسم...</option>
      </select>
    </div>

    <div style="flex:2; min-width:180px;">
      <label style="font-size:11px; font-weight:bold; color:var(--ink-soft,#64748b); display:block; margin-bottom:2px;">🔍 البحث عن تلميذ</label>
      <input type="text" id="studentSearch" placeholder="اكتب الاسم..." style="padding: 6px;">
    </div>
  </div>

  <div id="matrixContainer" class="matrix-table-wrapper">
    <div class="loading-text">اختر قسماً لبدء الرصد...</div>
  </div>

</div>

<script src="assets/config.js"></script>
<script>
let profile = null;
let selectedDate = null;
let currentDayPeriods = [];
let isMatrixLoading = false; // لمنع التحميل المزدوج المستمر

function safeToast(msg) {
  if (typeof showToast === 'function') showToast(msg);
  else console.log(msg);
}

function fmtDateOf(iso) {
  const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
  const d = new Date(iso + "T00:00:00");
  return `${dayNames[d.getDay()]} — ${d.toLocaleDateString("ar-DZ")}`;
}

async function init() {
  profile = await requireSession(["teacher", "supervisor", "admin"]);
  if (!profile) return;

  document.getElementById("teacherName").textContent = profile.full_name;

  selectedDate = (typeof todayISO === 'function') ? todayISO() : new Date().toISOString().split("T")[0];
  const picker = document.getElementById("datePicker");
  picker.value = selectedDate;
  picker.max = selectedDate;
  
  // الأحداث (Event Listeners) تم ربطها مرة واحدة فقط هنا
  picker.addEventListener("change", () => {
    selectedDate = picker.value || todayISO();
    document.getElementById("dateLabel").textContent = fmtDateOf(selectedDate);
    loadClassMatrix();
  });

  document.getElementById("classSelector").addEventListener("change", loadClassMatrix);
  document.getElementById("studentSearch").addEventListener("keyup", filterStudents);

  document.getElementById("dateLabel").textContent = fmtDateOf(selectedDate);

  const { data: classes } = await db.from("classes").select("id, name").order("name");
  const classSelector = document.getElementById("classSelector");
  
  if (classes && classes.length > 0) {
    classSelector.innerHTML = `<option value="">اختر القسم...</option>`;
    classes.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c.id;
      opt.textContent = c.name;
      classSelector.appendChild(opt);
    });
  } else {
    classSelector.innerHTML = `<option value="">لا توجد أقسام</option>`;
  }
}

async function loadClassMatrix() {
  if (isMatrixLoading) return; // منع التكرار إذا كان جاري التحميل بالأنشطة السابقة
  
  const classId = document.getElementById("classSelector").value;
  const container = document.getElementById("matrixContainer");

  if (!classId) {
    container.innerHTML = `<div class="empty-state"><div class="icon">🏫</div>يرجى اختيار قسم لمتابعة الغيابات.</div>`;
    return;
  }

  isMatrixLoading = true;

  if (typeof getPeriodsForDay === 'function') {
    currentDayPeriods = getPeriodsForDay(selectedDate);
  } else {
    const d = new Date(selectedDate + "T00:00:00");
    const dayOfWeek = d.getDay();
    if (dayOfWeek === 5 || dayOfWeek === 6) {
      currentDayPeriods = [];
    } else if (dayOfWeek === 2) {
      currentDayPeriods = [
        { slot: 1, label: "ح1", time: "08-09" },
        { slot: 2, label: "ح2", time: "09-10" },
        { slot: 3, label: "ح3", time: "10-11" },
        { slot: 4, label: "ح4", time: "11-12" }
      ];
    } else {
      currentDayPeriods = [
        { slot: 1, label: "ح1", time: "08-09" },
        { slot: 2, label: "ح2", time: "09-10" },
        { slot: 3, label: "ح3", time: "10-11" },
        { slot: 4, label: "ح4", time: "11-12" },
        { slot: 5, label: "ح5", time: "13-14" },
        { slot: 6, label: "ح6", time: "14-15" },
        { slot: 7, label: "ح7", time: "15-16" }
      ];
    }
  }

  if (!currentDayPeriods || currentDayPeriods.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">🏖️</div>عطلة أسبوعية — لا توجد حصص مبرمجة.</div>`;
    isMatrixLoading = false;
    return;
  }

  container.innerHTML = `<div class="loading-text">جاري تحميل الغيابات...</div>`;

  try {
    const [{ data: students }, { data: records }] = await Promise.all([
      db.from("students").select("id, full_name").eq("class_id", classId).eq("active", true).order("full_name"),
      db.from("attendance_records").select("id, student_id, hour_slot, status").eq("class_id", classId).eq("record_date", selectedDate)
    ]);

    if (!students || students.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="icon">👤</div>لا يوجد تلاميذ في هذا القسم.</div>`;
      isMatrixLoading = false;
      return;
    }

    const recMap = {};
    (records || []).forEach(r => {
      recMap[`${r.student_id}_${r.hour_slot}`] = { id: r.id, status: r.status };
    });

    let html = `
      <table class="matrix-table">
        <thead>
          <tr>
            <th>اسم التلميذ</th>`;
    
    currentDayPeriods.forEach(p => {
      html += `<th>${p.label}<br><span style="font-size:9px; opacity:0.75;">${p.time}</span></th>`;
    });

    html += `</tr></thead><tbody id="matrixBody">`;

    students.forEach(s => {
      html += `<tr class="student-item" data-name="${s.full_name}">
        <td>${s.full_name}</td>`;

      currentDayPeriods.forEach(p => {
        const rec = recMap[`${s.student_id}_${p.slot}`];
        const status = rec ? rec.status : "حاضر";
        let btnClass = "slot-btn present";
        if (status === "غائب") btnClass = "slot-btn absent";
        else if (status === "تسوية وضعية" || status === "خروج استثنائي") btnClass = "slot-btn resolved";

        html += `<td>
          <button class="${btnClass}" data-studentid="${s.id}" data-slot="${p.slot}" onclick="toggleSlot(this)">
            ${p.slot}
          </button>
        </td>`;
      });

      html += `</tr>`;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
    filterStudents();
  } catch (e) {
    console.error(e);
  } finally {
    isMatrixLoading = false;
  }
}

async function toggleSlot(btn) {
  const studentId = btn.dataset.studentid;
  const slot = parseInt(btn.dataset.slot);
  const classId = document.getElementById("classSelector").value;

  if (btn.classList.contains("present")) {
    btn.className = "slot-btn absent";
    await db.from("attendance_records").upsert({
      student_id: studentId, class_id: classId, record_date: selectedDate, hour_slot: slot, status: "غائب", recorded_by: profile.id
    }, { onConflict: "student_id,record_date,hour_slot" });
    safeToast("تم تسجيل الغياب ✓");

  } else if (btn.classList.contains("absent")) {
    btn.className = "slot-btn resolved";
    await db.from("attendance_records").update({
      status: "تسوية وضعية", updated_at: new Date().toISOString()
    }).eq("student_id", studentId).eq("record_date", selectedDate).eq("hour_slot", slot);
    safeToast("تم تسوية الوضعية ⚠️");

  } else {
    btn.className = "slot-btn present";
    await db.from("attendance_records").delete()
      .eq("student_id", studentId).eq("record_date", selectedDate).eq("hour_slot", slot);
    safeToast("تم إلغاء الغياب 🟢");
  }
}

function filterStudents() {
  const q = document.getElementById("studentSearch").value.toLowerCase().trim();
  const rows = document.querySelectorAll(".student-item");
  rows.forEach(row => {
    const name = row.dataset.name.toLowerCase();
    row.style.display = name.includes(q) ? "" : "none";
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
<div class="app-footer">© جميع الحقوق محفوظة — OUSSAMA SARI 2026</div>
</body>
</html>
